<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>mobile-select demo</title>
</head>
<body>
<div class="ms-mobile-select ms-show"><div class="ms-gray-layer"></div>
        <div class="ms-content">
          <div class="ms-btn-bar">
            <div class="ms-fix-width">
              <div class="ms-cancel">取消</div>
              <div class="ms-title">单项选择</div>
              <div class="ms-ensure">确认</div>
            </div>
          </div>
          <div class="ms-panel">
            <div class="ms-fix-width">
            <div class="ms-wheels"><div class="ms-wheel" data-index="0" style="width: 100%;"><ul class="ms-select-container" style="transform: translate3d(0px, 0px, 0px);"><li>周日</li><li>周一</li><li>周二</li><li>周三</li><li>周四</li><li>周五</li><li>周六</li></ul></div></div>
            <div class="ms-select-line"></div>
            <div class="ms-shadow-mask"></div>
          </div>
        </div></div></div>
</body>
</html>
