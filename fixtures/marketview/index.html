<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarketView — Arquitetura Visual de Estratégias</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#111823; --bg3:#161f2c; --line:#22303f; --line2:#2c3d50;
  --fg:#dbe6f0; --fg2:#8fa3b8; --fg3:#5d7189;
  --accent:#4da3ff; --accent2:#7c5cff; --ok:#3ddc97; --warn:#ffc857; --err:#ff6b6b;
  --L0:#8b6cff; --L1:#4da3ff; --L2:#2fd4c8; --L3:#3ddc97; --L4:#c3e34b;
  --L5:#ffc857; --L6:#ff9f45; --L7:#ff6b6b; --L8:#a0768f;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{
  background:var(--bg3);border:1px solid var(--line2);color:var(--fg);
  padding:5px 10px;border-radius:0;cursor:pointer;transition:.12s;white-space:nowrap;
}
button:hover{background:#1e2b3c;border-color:#3d5570}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,#2f7fd6,#2266b4);border-color:#3d84cc}
button.primary:hover{background:linear-gradient(180deg,#3a8de4,#2870c2)}
button.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
button.ghost:hover{background:var(--bg3);color:var(--fg)}
button.danger{border-color:#5c2b2b;color:#ff9c9c}
button.danger:hover{background:#3a1e1e}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{
  background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:5px 8px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.5}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);margin:10px 0 4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243343}
::-webkit-scrollbar-thumb:hover{background:#33475d}

/* ---------- layout ---------- */
#app{display:grid;grid-template-rows:44px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;overflow:hidden}
#topbar{
  display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;overflow:hidden;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
#topbar #graphName{flex:0 1 auto;min-width:48px}
#topbar .brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
#topbar .brand span{color:var(--accent)}
#topbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#topbar .spacer{flex:1}
.pill{
  font-family:var(--mono);font-size:11px;color:var(--fg3);
  border:1px solid var(--line);border-radius:0;padding:3px 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;
}
#main{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
.panel{background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.panel-h{
  display:flex;align-items:center;gap:6px;padding:8px 10px;flex:0 0 auto;
  border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--fg3);font-weight:600;
}
.panel-h .spacer{flex:1}
.panel-b{overflow:auto;padding:8px 10px;flex:1 1 auto;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{
  padding:6px 10px;font-size:11px;color:var(--fg3);cursor:pointer;border-radius:0;
  border:1px solid transparent;border-bottom:none;
}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--bg3);color:var(--fg);border-color:var(--line)}

/* ---------- canvas ---------- */
#center{position:relative;background:var(--bg);min-width:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.panning{cursor:grabbing}
#svg.linking{cursor:crosshair}
.node-box{cursor:pointer}
.node-box rect.body{fill:var(--bg3);stroke-width:1.5;transition:filter .12s}
.node-box:hover rect.body{filter:brightness(1.25)}
.node-box.sel rect.body{stroke-width:2.5}
.node-box.trunk rect.body{fill:#1c2939;stroke-width:2.2}
.node-box.trunk .node-title{fill:#fff}
.node-box.sat rect.body{fill:#121a24;stroke-opacity:.5}
.node-box.sat:hover rect.body{stroke-opacity:1}
.node-box.sat .node-title{fill:var(--fg2)}
.node-box.sat .node-kind{fill:var(--fg3)}
.node-box text{pointer-events:none;font-family:var(--sans)}
.node-title{font-size:12px;font-weight:600;fill:var(--fg)}
.node-kind{font-size:9px;fill:var(--fg3);letter-spacing:.06em;text-transform:uppercase}
.node-meta{font-size:9px;fill:var(--fg2);font-family:var(--mono)}
.edge{fill:none;stroke-width:1.6;opacity:.75}
.edge:hover{opacity:1;stroke-width:2.6}
.edge.sel{opacity:1;stroke-width:3}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.band rect{fill:#ffffff;opacity:.014}
.band text{font-size:10px;fill:var(--fg3);letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.band line{stroke:var(--line);stroke-dasharray:2 6}
.seg{display:flex;border:1px solid var(--line2);border-radius:0;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 11px;font-size:11px;font-family:var(--mono);background:transparent;color:var(--fg3)}
.seg button.on{background:var(--accent);color:#06111f;font-weight:700}
.seg button:hover:not(.on){background:var(--bg3);color:var(--fg)}
#c3d{position:absolute;inset:0;display:block;cursor:grab;touch-action:none}
#center{min-height:0}
#hud3d{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:5px 7px;z-index:5;
  background:rgba(11,15,20,.82);border:1px solid var(--line);border-radius:0;
  backdrop-filter:blur(6px);
}
#hud3d button{padding:3px 9px;font-size:11px;background:transparent;border-color:transparent;color:var(--fg3)}
#hud3d button:hover{background:var(--bg3);color:var(--fg)}
#hud3d button.on{color:var(--accent)}
#hud3d .hsep{width:1px;height:16px;background:var(--line);margin:0 3px}
.anchor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px;margin-top:4px}
.anchor-grid div{
  height:22px;border:1px solid var(--line2);border-radius:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--fg3);
  font-family:var(--mono);
}
.anchor-grid div:hover{border-color:var(--accent);color:var(--fg)}
.anchor-grid div.on{background:var(--accent);border-color:var(--accent);color:#06111f;font-weight:700}
.anchor-grid div.mid{font-size:8px}
.pl-chip{
  display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 5px;
  border:1px solid var(--line2);margin:0 3px 3px 0;cursor:pointer;
}
.pl-chip:hover{background:var(--bg3)}
.pl-chip.on{background:var(--bg3);font-weight:700}
.layer-row{padding:5px 6px;margin:2px -6px;cursor:pointer;border-left:2px solid transparent}
.layer-row:hover{background:var(--bg3);border-left-color:var(--accent)}
.layer-row .lcount{float:right;font-family:var(--mono);color:var(--fg3)}
.node-box.msel rect.body{stroke:#fff;stroke-width:2.2}
.node-box.tag rect.body{fill:none;stroke:none}
.vrow{display:flex;align-items:center;gap:8px;margin:7px 0}
.vrow label{margin:0;flex:0 0 96px;text-transform:none;letter-spacing:0;font-size:11px;color:var(--fg2)}
.vrow input[type=range]{flex:1;width:auto;padding:0;background:transparent;border:none;accent-color:var(--accent)}
.vrow .vval{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--fg3)}
.seg2{display:flex;border:1px solid var(--line2);overflow:hidden}
.seg2 button{border:none;border-radius:0;flex:1;padding:4px 0;font-size:11px;background:transparent;color:var(--fg3)}
.seg2 button.on{background:var(--accent);color:#06111f;font-weight:700}
.seg2 button:hover:not(.on){background:var(--bg3);color:var(--fg)}

/* ---------- tema claro ---------- */
body.light{
  --bg:#ffffff; --bg2:#f4f7fb; --bg3:#e8eef6; --line:#d3dde8; --line2:#bcc9d8;
  --fg:#16222f; --fg2:#4a5b6e; --fg3:#7b8ca0;
  --accent:#1b6fd0; --accent2:#6b4fe0; --ok:#128a5b; --warn:#a8760a; --err:#c0392b;
}
body.light #svg{background:#ffffff}
body.light .band rect{fill:#0b1220;opacity:.022}
body.light .band line{stroke:#c8d4e0}
body.light .node-box rect.body{fill:#ffffff}
body.light .node-box.trunk rect.body{fill:#e9f1fe}
body.light .node-box.sat rect.body{fill:#f5f8fc}
body.light .node-title{fill:#16222f}
body.light .node-box.trunk .node-title{fill:#0b1622}
body.light .node-kind{fill:#7b8ca0}
body.light .node-meta{fill:#4a5b6e}
body.light .node-box.msel rect.body{stroke:#0b1018}
body.light #hint,body.light #legend3d,body.light #hud3d,body.light #depthbar,
body.light #presexit{background:rgba(255,255,255,.9)}
body.light .modal-bg{background:rgba(230,236,244,.72)}
body.light pre.code{color:#233242}
body.light ::-webkit-scrollbar-thumb{background:#c3cedb}
#hint{
  position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--fg3);
  background:rgba(11,15,20,.85);border:1px solid var(--line);border-radius:0;padding:6px 10px;
  pointer-events:none;font-family:var(--mono);
}
#depthbar{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(11,15,20,.84);border:1px solid var(--line);padding:8px 7px;
  backdrop-filter:blur(4px);user-select:none;
}
/* largura travada: sem isso o rótulo "muito forte" alarga a coluna e, como ela
   está ancorada à direita, o trilho escorrega de lado sob o cursor */
#depthbar{width:76px}
#depthbar .dv{
  font-family:var(--mono);font-size:8.5px;color:var(--fg2);white-space:nowrap;
  width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;
}
#depthbar .dl{font-family:var(--mono);font-size:8px;color:var(--fg3);letter-spacing:.08em}
#depthbar .dtrack{
  position:relative;width:12px;height:196px;cursor:ns-resize;
  background:linear-gradient(to top,#0b1119,#1a2634);border:1px solid var(--line2);
}
#depthbar .dfill{
  position:absolute;left:0;bottom:0;width:100%;
  background:linear-gradient(to top,rgba(77,163,255,.18),rgba(77,163,255,.55));
  pointer-events:none;
}
#depthbar .dhandle{
  position:absolute;left:-4px;width:20px;height:4px;margin-bottom:-2px;
  background:var(--accent);pointer-events:none;box-shadow:0 0 6px rgba(77,163,255,.6);
}
#depthbar .dticks{position:absolute;inset:0;pointer-events:none}
#depthbar .dticks i{position:absolute;right:-5px;width:4px;height:1px;background:var(--fg3);opacity:.7}
#presexit{
  position:absolute;top:12px;right:12px;z-index:9;font-size:11px;
  background:rgba(11,15,20,.9);border:1px solid var(--accent);color:var(--fg);padding:5px 11px;
}
#presexit:hover{background:var(--accent);color:#06111f}
#legend3d{
  position:absolute;left:12px;bottom:46px;max-width:340px;z-index:4;
  background:rgba(11,15,20,.86);border:1px solid var(--line);padding:7px 9px;
  display:flex;flex-wrap:wrap;gap:4px 8px;pointer-events:none;backdrop-filter:blur(4px);
}
#legend3d .lg{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--fg2)}
#legend3d .lg b{
  font-family:var(--mono);font-size:9.5px;padding:1px 4px;border:1px solid;background:rgba(7,11,16,.9);
}
#legend3d .lgh{width:100%;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:1px}
#zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
#zoombar button{padding:4px 8px;font-family:var(--mono)}

/* ---------- flows ---------- */
.flowpill{cursor:pointer;border-color:var(--accent);color:var(--fg)}
.flowpill:hover{background:var(--bg3)}
.flow-row{
  display:flex;align-items:center;gap:7px;padding:5px 7px;cursor:pointer;
  border:1px solid transparent;border-left-width:3px;margin-bottom:3px;font-size:12px;
}
.flow-row:hover{background:var(--bg3)}
.flow-row.on{background:#16233a;border-color:var(--line2)}
.flow-row .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-row .fcount{font-family:var(--mono);font-size:10px;color:var(--fg3)}
.flow-row.all{border-left-color:var(--line2)}
.flow-desc{font-size:10px;color:var(--fg3);line-height:1.4;padding:0 8px 6px 12px}
.flow-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 7px;margin:0 4px 4px 0;
  border:1px solid var(--line2);color:var(--fg3);cursor:pointer;
}
.flow-chip:hover{color:var(--fg)}
.flow-chip.on{color:var(--fg);background:var(--bg3)}
.flow-chip i{width:7px;height:7px;display:inline-block}

/* ---------- palette ---------- */
.pal-layer{margin-bottom:10px}
.pal-layer h4{
  margin:0 0 5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;color:var(--fg2);font-weight:600;
}
.pal-layer h4 i{width:7px;height:7px;border-radius:0;display:inline-block}
.pal-items{display:flex;flex-wrap:wrap;gap:4px}
.pal-item{
  font-size:11px;padding:3px 7px;border-radius:0;cursor:pointer;
  background:var(--bg3);border:1px solid var(--line);color:var(--fg2);
}
.pal-item:hover{border-color:var(--accent);color:var(--fg)}

/* ---------- tree ---------- */
.tree-row{
  display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:0;cursor:pointer;
  font-size:12px;white-space:nowrap;
}
.tree-row:hover{background:var(--bg3)}
.tree-row.sel{background:#1d3350}
.tree-row i{width:6px;height:6px;border-radius:0;flex:0 0 auto}
.tree-row .k{color:var(--fg3);font-size:10px;font-family:var(--mono)}

/* ---------- inspector ---------- */
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);
  padding:2px 7px;border-radius:0;border:1px solid var(--line2);color:var(--fg2);
}
.edge-item{
  display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:0;
  font-size:11px;background:var(--bg3);margin-bottom:4px;cursor:pointer;
}
.edge-item:hover{background:#1e2b3c}
.edge-item .ek{font-family:var(--mono);font-size:9px;color:var(--fg3);text-transform:uppercase}
.empty{color:var(--fg3);font-size:12px;text-align:center;padding:24px 8px;line-height:1.6}

/* ---------- issues ---------- */
.issue{
  border-left:2px solid var(--line2);padding:5px 8px;margin-bottom:5px;border-radius:0;
  background:var(--bg3);font-size:11px;line-height:1.45;cursor:pointer;
}
.issue:hover{background:#1e2b3c}
.issue.error{border-left-color:var(--err)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--accent)}
.issue b{color:var(--fg)}
.issue .where{font-family:var(--mono);font-size:10px;color:var(--fg3)}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;
}
.modal{
  background:var(--bg2);border:1px solid var(--line2);border-radius:0;
  width:min(860px,92vw);max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.modal-h .spacer{flex:1}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
pre.code{
  background:var(--bg);border:1px solid var(--line);border-radius:0;padding:12px;
  font-family:var(--mono);font-size:11px;line-height:1.55;overflow:auto;max-height:52vh;
  white-space:pre;margin:0;color:#c8d6e5;
}
.diff-add{color:var(--ok)} .diff-del{color:var(--err)} .diff-mod{color:var(--warn)}

/* ---------- ai ---------- */
.ai-msg{font-size:12px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px}
.ai-status{font-size:11px;font-family:var(--mono);color:var(--fg3);padding:4px 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:0;background:var(--fg3);margin-right:6px}
.dot.on{background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.small{font-size:11px;color:var(--fg3);line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">Market<span>View</span></div>
    <div class="seg"><button id="btn2d" class="on">2D</button><button id="btn3d">3D</button></div>
    <div class="pill" id="graphName">arquitetura sem título</div>
    <div class="pill flowpill" id="viewPill" style="display:none"></div>
    <div class="sep"></div>
    <button id="btnAuto" title="Recalcular layout em camadas">Auto-layout</button>
    <button id="btnLink" title="Conectar dois nós (L)">Conectar</button>
    <button id="btnDelete" class="danger" title="Remover seleção (Del)">Remover</button>
    <div class="sep"></div>
    <button id="btnValidate">Validar</button>
    <button id="btnMermaid">Mermaid</button>
    <button id="btnAscii">ASCII</button>
    <button id="btnJson">JSON</button>
    <div class="spacer"></div>
    <span class="pill" id="stats">0 nós · 0 arestas</span>
    <div class="sep"></div>
    <button id="btnSeed" class="ghost" title="Carregar exemplo">Exemplo</button>
    <button id="btnNew" class="ghost">Novo</button>
    <button id="btnOpen" class="ghost">Abrir</button>
    <button id="btnSave" class="ghost">Salvar</button>
    <button id="btnSettings" class="ghost">⚙</button>
  </div>

  <div id="main">
    <!-- ============ LEFT ============ -->
    <div class="panel" id="left">
      <div class="tabs">
        <div class="tab on" data-lt="palette">Paleta</div>
        <div class="tab" data-lt="flows">Fluxos</div>
        <div class="tab" data-lt="tree">Hierarquia</div>
      </div>
      <div class="panel-b" id="leftBody"></div>
    </div>

    <!-- ============ CENTER ============ -->
    <div id="center">
      <canvas id="c3d" style="display:none"></canvas>
      <div id="hud3d" style="display:none">
        <button data-v="iso">iso</button>
        <button data-v="top">topo</button>
        <button data-v="front">frente</button>
        <button data-v="side">lado</button>
        <span class="hsep"></span>
        <button id="h3fit">enquadrar</button>
        <button id="h3iso">isolar</button>
        <button id="h3reset">reset</button>
        <span class="hsep"></span>
        <button id="h3depth" title="escala de perspectiva aérea — clique para trocar (M mostra a régua)">profundidade</button>
        <button id="h3pl" class="on" title="mostra o que trafega em cada conector (P)">▣ dados</button>
        <button id="h3grid" class="on">grade</button>
        <button id="h3spin">girar</button>
        <button id="h3unpin">soltar fixados</button>
      </div>
      <svg id="svg">
        <defs id="defs"></defs>
        <g id="viewport">
          <g id="gBands"></g>
          <g id="gEdges"></g>
          <g id="gNodes"></g>
          <g id="gTemp"></g>
        </g>
      </svg>
      <div id="depthbar" style="display:none" title="intensidade da perspectiva — arraste, roda ajusta fino, duplo clique volta ao médio">
        <div class="dv">médio</div>
        <div class="dtrack" id="dTrack">
          <div class="dfill"></div>
          <div class="dticks"></div>
          <div class="dhandle"></div>
        </div>
        <div class="dl">prof.</div>
      </div>

/* alvos que definem a carga melhor que a origem */
const CONSUMES = {

  imbalance:"book", stateStore:"book", feedArbiter:"sbe",
  execReport:"fill", alert:"alrt",

/* carga de uma relação: explícita se o usuário definiu, senão inferida */
function payloadOf(e){
  if(e.pl && e.pl.length) return e.pl.filter(p => PAYLOADS[p]);
  const a = Store.nodes[e.from], b = Store.nodes[e.to];
  if(!a || !b) return [];
  if(e.kind === "composes") return [];                    // contenção não transporta nada
  const byTarget = CONSUMES[b.kind];
  if(byTarget) return [byTarget];
  const bySource = EMITS[a.kind];
  if(bySource) return [bySource];
  if(e.kind === "constrains") return ["veto"];
  if(e.kind === "monitors")   return ["tel"];
  if(e.kind === "references") return ["ref"];
  if(e.kind === "routes")     return ["order"];
  return [];
}
function payloadsInView(){
  const seen = new Map();
  vEdges().forEach(e => payloadOf(e).forEach(p => seen.set(p, (seen.get(p)||0)+1)));
  return [...seen.entries()].sort((x,y) => y[1]-x[1]);
}

/* ==========================================================================
   Store
   ========================================================================== */
const Store = {
  name: "arquitetura sem título",
  nodes: {},          // id -> node
  edges: {},          // id -> edge
  flows: [],          // regras de negócio nomeadas
  view: null,         // Set de fluxos visíveis, ou null = tudo
  multi: new Set(),   // seleção múltipla (por camada ou ctrl+clique)
  seq: 1,
  sel: null,          // {type:'node'|'edge', id}
  dirty: false,
};

function uid(prefix){ return prefix + "_" + (Store.seq++).toString(36) + Math.random().toString(36).slice(2,5); }

function defaultProps(kind){
  const k = KINDS[kind]; const p = {};
  (k.fields||[]).forEach(f => { p[f.key] = (f.def !== undefined ? f.def : (f.type==="number"?0:(f.type==="bool"?false:""))); });
  return p;
}

function addNode(kind, label, props, opts){
  if(!KINDS[kind]) throw new Error("tipo desconhecido: " + kind);
  const id = (opts && opts.id && !Store.nodes[opts.id]) ? opts.id : uid(kind);
  const n = {
    id, kind,
    label: label || KINDS[kind].label,
    props: Object.assign(defaultProps(kind), props||{}),
    notes: (opts && opts.notes) || "",
    flows: (opts && opts.flows) ? opts.flows.slice() : [],
    status: (opts && opts.status) || "ok",
    x: (opts && opts.x), y: (opts && opts.y), pinned: !!(opts && opts.pinned),
  };
  Store.nodes[id] = n; Store.dirty = true;
  return n;
}

function addEdge(from, to, kind, label){
  if(!Store.nodes[from] || !Store.nodes[to] || from === to) return null;
  const dup = Object.values(Store.edges).find(e => e.from===from && e.to===to && e.kind===kind);
  if(dup) return dup;
  const e = { id: uid("e"), from, to, kind: kind || "feeds", label: label || "", a1:null, a2:null, pl:null };
  Store.edges[e.id] = e; Store.dirty = true;
  return e;
}

function removeNode(id){
  delete Store.nodes[id];
  Object.values(Store.edges).forEach(e => { if(e.from===id||e.to===id) delete Store.edges[e.id]; });
  Store.dirty = true;
}
function removeEdge(id){ delete Store.edges[id]; Store.dirty = true; }

function nodeList(){ return Object.values(Store.nodes); }
function edgeList(){ return Object.values(Store.edges); }

/* ==========================================================================
   Fluxos — regras de negócio mapeadas sobre o grafo.
   Um fluxo é um recorte nomeado: "recepção de dados de mercado", "controle de
   risco antes do envio". Um nó pertence a quantos fluxos fizer sentido, e o
   mapa passa a mostrar só o recorte ativo. O grafo em si não muda.
   ========================================================================== */
function flowById(id){ return Store.flows.find(f => f.id === id); }
function flowNodes(id){ return nodeList().filter(n => (n.flows||[]).includes(id)); }

function inView(n){
  if(!Store.view || !Store.view.size) return true;
  const fs = n.flows || [];
  for(const f of Store.view) if(fs.includes(f)) return true;
  return false;
}
function vNodes(){ return nodeList().filter(inView); }
function vEdges(){ return edgeList().filter(e => {
  if(Vis.hide[e.kind]) return false;
  const a = Store.nodes[e.from], b = Store.nodes[e.to];
  return a && b && inView(a) && inView(b); }); }
function vIn(id){ return inEdges(id).filter(e => { const a = Store.nodes[e.from]; return a && inView(a); }); }
function vOut(id){ return outEdges(id).filter(e => { const b = Store.nodes[e.to]; return b && inView(b); }); }

function setView(ids){
  Store.view = (ids && ids.length) ? new Set(ids) : null;
  if(typeof Scene !== "undefined" && Scene.iso) exitIsolate();
  Store.sel = null;
  redraw(true);
  if(typeof Scene !== "undefined" && Scene.on) fit3D(); else zoomFit();
  persist();
}
function toggleView(id){
  const cur = Store.view ? [...Store.view] : [];
  setView(cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id));
}
function viewLabel(){
  if(!Store.view || !Store.view.size) return null;
  const names = [...Store.view].map(id => (flowById(id)||{}).name).filter(Boolean);
  return names.length === 1 ? names[0] : names.length + " fluxos";
}

function addFlow(name, color, desc, id){
  const f = { id: id || uid("f"), name: name || "novo fluxo",
              color: color || FLOW_COLORS[Store.flows.length % FLOW_COLORS.length],
              desc: desc || "" };
  Store.flows.push(f); Store.dirty = true;
  return f;
}
function removeFlow(id){
  Store.flows = Store.flows.filter(f => f.id !== id);
  nodeList().forEach(n => { if(n.flows) n.flows = n.flows.filter(x => x !== id); });
  if(Store.view && Store.view.has(id)){
    const rest = [...Store.view].filter(x => x !== id);
    setView(rest);
  }
  Store.dirty = true;
}
function setFlowMember(nodeId, flowId, on){
  const n = Store.nodes[nodeId]; if(!n) return;
  n.flows = n.flows || [];
  const has = n.flows.includes(flowId);
  if(on && !has) n.flows.push(flowId);
  if(!on && has) n.flows = n.flows.filter(x => x !== flowId);
  Store.dirty = true;
}

const VIS_DEFAULT = {
  spaceY:1, spaceR:1,                    // espaçamento 3D (vertical / radial)
  cardW:1, cardH:1,                      // tamanho das caixas
  shape:"caixa",                         // caixa | barra | etiqueta
  show:{ icon:true, kind:true, label:true, meta:true, flows:false },
  curve:1,                               // curvatura dos conectores 3D
  edgeW:1,                               // espessura das relações
  hide:{},                               // tipos de relação ocultos
  fontMin:0,                             // piso da fonte no 3D (0 = escala pura)
  ringOrder:"subárvore",                 // subárvore | camada
  colorBy:"",                            // "" = camada · flow · prop:<chave>
  presentation:false,
};
const Vis = Object.assign({}, VIS_DEFAULT,
  (() => { try { return JSON.parse(localStorage.getItem("mv_vis") || "{}"); } catch(_){ return {}; } })());
Vis.show = Object.assign({}, VIS_DEFAULT.show, Vis.show || {});
Vis.hide = Object.assign({}, Vis.hide || {});
Vis.presentation = false;                // nunca abre em modo apresentação

function saveVis(){ try{ localStorage.setItem("mv_vis", JSON.stringify(Vis)); }catch(_){} }
function applyCardSize(){
  NW = Math.round(200*Vis.cardW); NH = Math.round(60*Vis.cardH);
  SW = Math.round(152*Vis.cardW); SH = Math.round(44*Vis.cardH);
  CARD_W = 13*Vis.cardW;          CARD_H = 4.4*Vis.cardH;
}

/* "distância atual, proporcionalmente": em vez de refazer o layout, escala as
   posições que já existem — quem você arrastou à mão continua no lugar relativo */
function applySpacing(ny, nr){
  const ry = ny/Vis.spaceY, rr = nr/Vis.spaceR;
  nodeList().forEach(n => { if(n.p3){ n.p3.y *= ry; n.p3.x *= rr; n.p3.z *= rr; } });
  if(typeof Scene !== "undefined" && Scene.iso)
    Object.values(Scene.iso.pos).forEach(p => { p.y *= ry; p.x *= rr; p.z *= rr; });
  Vis.spaceY = ny; Vis.spaceR = nr; saveVis();
}

const FLOW_COLORS = ["#4da3ff","#ff9f45","#ff6b6b","#2fd4c8","#c3e34b","#8b6cff",
                     "#ffc857","#3ddc97","#e879f9","#38bdf8","#f472b6","#a0768f",
                     "#fb923c","#94a3b8"];
function layerOf(n){ return KINDS[n.kind] ? KINDS[n.kind].layer : 8; }
function inEdges(id){ return edgeList().filter(e => e.to === id); }
function outEdges(id){ return edgeList().filter(e => e.from === id); }

   ========================================================================== */
/* Duas classes de nó por camada:
   núcleo  — tem continuação para baixo, forma o espinho do fluxo
   folha   — termina ali ou só retorna para cima; pende do núcleo, em caixa menor */
let NW = 200, NH = 60;            // núcleo  (base × Vis.cardW/H)
let SW = 152, SH = 44;            // folha
const GAPX = 26, SGAPX = 14;
const BAND_PAD = 30, SAT_GAP = 26, BAND_BOT = 26;

const nodeW = n => n._sat ? SW : NW;
const nodeH = n => {
  const base = n._sat ? SH : NH;
  if(Vis.shape === "barra")    return Math.max(24, base*0.58);
  if(Vis.shape === "etiqueta") return Math.max(20, base*0.42);
  return base;
};
const cxOf  = n => n.x + nodeW(n)/2;

const View = { tx: 60, ty: 40, k: 1 };
const UI = { linking:false, linkFrom:null, drag:null, pan:null, bands:[], lanes:{}, contentRight:0 };

const svg   = document.getElementById("svg");
const vp    = document.getElementById("viewport");
const gB    = document.getElementById("gBands");
const gE    = document.getElementById("gEdges");
const gN    = document.getElementById("gNodes");
const gT    = document.getElementById("gTemp");
const defs  = document.getElementById("defs");

function el(tag, attrs, parent){
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in (attrs||{})){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* ---------- marcadores de seta, um por tipo de aresta ---------- */
function buildDefs(){
  clear(defs);
  Object.entries(EDGE_KINDS).forEach(([k,v]) => {
    const m = el("marker",{id:"arw_"+k,viewBox:"0 0 10 10",refX:9,refY:5,
      markerWidth:6,markerHeight:6,orient:"auto-start-reverse"},defs);
    el("path",{d:"M0,0 L10,5 L0,10 z",fill:v.hex},m);
  });
}

/* ==========================================================================
   Layout: camadas fixas por tipo, ordenação por baricentro
   ========================================================================== */
/* Um nó é folha quando não tem continuação descendente: só termina, ou só
   devolve algo para cima (restringe, roteia, observa). É o critério que separa
   o espinho — exchange → dado → cálculo → sinal → ordem — do que pende dele. */
function classify(){
  vNodes().forEach(n => {
    const L = layerOf(n);
    const down = vOut(n.id).filter(e => {
      const t = Store.nodes[e.to];
      return t && e.kind !== "monitors" && layerOf(t) >= L;
    });
    n._sat = down.length === 0 && n.kind !== "exchange";
  });
}

/* O tronco: o caminho descendente mais longo do grafo, desempatado por grau.
   É a artéria — exchange → dado → cálculo → decisão → ordem. Fica alinhado no
   eixo central, e todo o resto se organiza em torno dele. */
/* DAG de descida: tudo que não sobe de camada e não fecha ciclo.
   Arestas entre nós da mesma camada contam — é por elas que passam
   exchange → gateway e estratégia → estrutura. */
function downwardDag(){
  const ns = vNodes();
  const adj = {}, radj = {};
  ns.forEach(n => { adj[n.id] = []; radj[n.id] = []; });
  const reaches = (from, to) => {
    const st = [to], seen = new Set([to]);
    while(st.length){
      const c = st.pop(); if(c === from) return true;
      (adj[c]||[]).forEach(x => { if(!seen.has(x)){ seen.add(x); st.push(x); } });
    }
    return false;
  };
  vEdges()
    .filter(e => { const a = Store.nodes[e.from], b = Store.nodes[e.to];
                   return a && b && a.id !== b.id && e.kind !== "monitors" && layerOf(b) >= layerOf(a); })
    .sort((x,y) => (layerOf(Store.nodes[y.to])-layerOf(Store.nodes[y.from]))
                 - (layerOf(Store.nodes[x.to])-layerOf(Store.nodes[x.from])))
    .forEach(e => {
      if(reaches(e.from, e.to)) return;          // fecharia ciclo
      adj[e.from].push(e.to); radj[e.to].push(e.from);
    });

  /* ordem topológica (Kahn) */
  const indeg = {}; ns.forEach(n => indeg[n.id] = radj[n.id].length);
  const topo = [], q = ns.filter(n => indeg[n.id] === 0).map(n => n.id);
  while(q.length){
    const id = q.shift(); topo.push(id);
    (adj[id]||[]).forEach(t => { if(--indeg[t] === 0) q.push(t); });
  }
  const inTopo = new Set(topo);
  ns.forEach(n => { if(!inTopo.has(n.id)) topo.push(n.id); });
  return { adj, radj, topo };
}

function computeTrunk(){
  const ns = vNodes();
  ns.forEach(n => n._trunk = false);
  if(!ns.length) return null;

  const { adj, radj, topo } = downwardDag();
  const kidsOf = n => (adj[n.id]||[]).map(id => Store.nodes[id]).filter(Boolean);
  const parsOf = n => (radj[n.id]||[]).map(id => Store.nodes[id]).filter(Boolean);
  const deg = n => vIn(n.id).length + vOut(n.id).length;
  const rtopo = topo.slice().reverse();
  const at = id => Store.nodes[id];
  const CAP = 1e12;

  /* quanto do grafo passa por cada nó: caminhos que chegam × caminhos que saem */
  const pin = {}, pout = {};
  topo.forEach(id => { const p = radj[id];
    pin[id] = p.length ? Math.min(CAP, p.reduce((a,m)=>a+(pin[m]||1),0)) : 1; });
  rtopo.forEach(id => { const k = adj[id];
    pout[id] = k.length ? Math.min(CAP, k.reduce((a,m)=>a+(pout[m]||1),0)) : 1; });
  const score = n => Math.log1p(pin[n.id]) + Math.log1p(pout[n.id]) + 0.2*Math.log1p(deg(n))
                   + (n._sat ? -2 : 0);

  /* caminho descendente de peso máximo */
  const fwd = {}, bwd = {};
  rtopo.forEach(id => { const n = at(id); if(!n) return;
    const k = adj[id];
    fwd[id] = score(n) + (k.length ? Math.max(...k.map(c => fwd[c]||0)) : 0); });
  topo.forEach(id => { const n = at(id); if(!n) return;
    const p = radj[id];
    bwd[id] = score(n) + (p.length ? Math.max(...p.map(c => bwd[c]||0)) : 0); });

  let seed = null, seedV = -Infinity;
  ns.forEach(n => {
    const v = fwd[n.id] + bwd[n.id] - score(n);
    if(v > seedV || (v === seedV && seed && n.id < seed.id)){ seed = n; seedV = v; }
  });
  if(!seed) return null;

  const trunk = new Set([seed.id]);
  const pick = (arr, table) => {
    let best = null, bv = -Infinity;
    arr.forEach(m => {
      if(trunk.has(m.id)) return;
      const v = table[m.id]||0;
      if(v > bv || (v === bv && best && m.id < best.id)){ best = m; bv = v; }
    });
    return best;
  };
  let cur = seed;
  for(;;){ const b = pick(parsOf(cur), bwd); if(!b) break; trunk.add(b.id); cur = b; }
  cur = seed;
  for(;;){ const b = pick(kidsOf(cur), fwd); if(!b) break; trunk.add(b.id); cur = b; }

  ns.forEach(n => n._trunk = trunk.has(n.id) && !n._sat);
  return trunk;
}

function computeLayout(force){
  const nodes = vNodes();
  if(!nodes.length){ UI.bands = []; UI.lanes = {}; return; }
  classify();
  computeTrunk();

  const byLayer = {};
  nodes.forEach(n => { const L = layerOf(n); (byLayer[L] = byLayer[L] || []).push(n); });
  const occupied = Object.keys(byLayer).map(Number).sort((a,b) => a-b);

  const spine = {}, sats = {};
  occupied.forEach(L => {
    spine[L] = byLayer[L].filter(n => !n._sat);
    sats[L]  = byLayer[L].filter(n =>  n._sat);
  });

  // ordem inicial estável do espinho
  occupied.forEach(L => spine[L].sort((a,b) => (a.order ?? 1e9) - (b.order ?? 1e9) || a.id.localeCompare(b.id)));

  // baricentro sobre o espinho: as folhas não puxam a ordem do fluxo principal
  const pos = {};
  const reindex = () => occupied.forEach(L => spine[L].forEach((n,i) => pos[n.id] = i));
  reindex();
  for(let it=0; it<10; it++){
    const dir = it % 2 === 0;
    (dir ? occupied : occupied.slice().reverse()).forEach(L => {
      const row = spine[L]; if(row.length < 2) return;
      row.forEach(n => {
        const nb = dir ? vIn(n.id).map(e=>e.from) : vOut(n.id).map(e=>e.to);
        const vals = nb.map(id => pos[id]).filter(v => v !== undefined);
        n._bary = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : pos[n.id];
      });
      row.sort((a,b) => a._bary - b._bary || a.id.localeCompare(b.id));
      reindex();
    });
  }

  const totalW = Math.max(
    3*(NW+GAPX),
    ...occupied.map(L => spine[L].length*(NW+GAPX) - GAPX),
    ...occupied.map(L => sats[L].length*(SW+SGAPX) - SGAPX)
  );

  const CENTER = totalW/2;
  UI.center = CENTER;

  let y = 0;
  UI.bands = [];
  occupied.forEach(L => {
    /* espinho: linha principal da faixa, deslocada para que o nó do tronco
       caia sempre no eixo central — é o que dá a leitura vertical */
    // o bloco do tronco vai para o meio da linha; o resto mantém a ordem relativa
    let row = spine[L];
    const tr = row.filter(n => n._trunk);
    if(tr.length && tr.length < row.length){
      const rest = row.filter(n => !n._trunk);
      const mid = Math.floor((rest.length)/2);
      row = [...rest.slice(0,mid), ...tr, ...rest.slice(mid)];
      spine[L] = row;
    }
    const rowW = row.length*(NW+GAPX) - GAPX;
    let x0 = (totalW - rowW)/2;
    // ajuste fino, no máximo meia célula: mantém o eixo do tronco reto
    if(tr.length){
      const i0 = row.indexOf(tr[0]), i1 = row.indexOf(tr[tr.length-1]);
      const blockMid = x0 + ((i0 + i1)/2)*(NW+GAPX) + NW/2;
      const delta = CENTER - blockMid;
      x0 += Math.max(-(NW+GAPX)/2, Math.min((NW+GAPX)/2, delta));
    }
    row.forEach((n,i) => {
      n.order = i;
      if(force || !n.pinned){ n.x = x0 + i*(NW+GAPX); n.y = y + BAND_PAD; if(force) n.pinned = false; }
      if(n.x === undefined) n.x = x0 + i*(NW+GAPX);
      if(n.y === undefined) n.y = y + BAND_PAD;
    });

    /* folhas: sublinha recuada, cada uma alinhada sob quem a origina */
    const sr = sats[L];
    const satY = y + BAND_PAD + NH + SAT_GAP;
    if(sr.length){
      sr.forEach(n => {
        const nb = [...vIn(n.id).map(e=>e.from), ...vOut(n.id).map(e=>e.to)]
          .map(id => Store.nodes[id]).filter(m => m && !m._sat && m.x !== undefined);
        n._target = nb.length ? nb.reduce((a,m)=>a+cxOf(m),0)/nb.length : totalW/2;
      });
      sr.sort((a,b) => a._target - b._target || a.id.localeCompare(b.id));
      const step = SW + SGAPX;
      let prev = -1e9;
      sr.forEach(n => { let px = n._target - SW/2; if(px < prev + step) px = prev + step; n._px = px; prev = px; });
      sr.forEach((n,i) => {
        n.order = 1000 + i;
        if(force || !n.pinned){ n.x = n._px; n.y = satY; if(force) n.pinned = false; }
        if(n.x === undefined) n.x = n._px;
        if(n.y === undefined) n.y = satY;
      });
    }

    const h = BAND_PAD + NH + (sr.length ? SAT_GAP + SH : 0) + BAND_BOT;
    UI.bands.push({ layer:L, y, h, w: totalW, sats: sr.length, satY });
    y += h;
  });

  UI.minX = Math.min(...nodes.map(n => n.x));
  UI.maxX = Math.max(...nodes.map(n => n.x + nodeW(n)));
  UI.totalH = y;
  assignLanes();
}

/* Arestas que sobem de camada — restringe, roteia de volta ao venue, observa —
   saem do fluxo e correm em canaletas verticais à direita. O miolo do desenho
   fica só com o que desce. */
function assignLanes(){
  UI.lanes = {};
  const ns = vNodes();
  if(!ns.length) return;
  const right = UI.maxX !== undefined ? UI.maxX : Math.max(...ns.map(n => n.x + nodeW(n)));
  UI.contentRight = right;
  vEdges()
    .filter(e => { const a = Store.nodes[e.from], b = Store.nodes[e.to];
                   return a && b && layerOf(b) < layerOf(a); })
    .sort((x,y) => {
      const sx = layerOf(Store.nodes[x.from]) - layerOf(Store.nodes[x.to]);
      const sy = layerOf(Store.nodes[y.from]) - layerOf(Store.nodes[y.to]);
      return sx - sy || x.id.localeCompare(y.id);
    })
    .forEach((e,i) => UI.lanes[e.id] = right + 48 + i*16);
}

/* ==========================================================================
   Render
   ========================================================================== */
function render(){
  ColorScale = colorScale();
  clear(gB); clear(gE); clear(gN);

  /* faixas de camada — a sublinha das folhas fica visivelmente rebaixada */
  const laneMax = Object.values(UI.lanes||{}).reduce((a,b)=>Math.max(a,b), 0);
  const bandL = (UI.minX !== undefined ? UI.minX : 0) - 250;
  const bandR = Math.max(laneMax + 40, (UI.maxX||0) + 60);
  UI.bands.forEach(b => {
    const L = LAYER_BY_ID[b.layer];
    const g = el("g",{class:"band"},gB);
    el("rect",{x:bandL,y:b.y,width:bandR-bandL,height:b.h},g);
    el("line",{x1:bandL,y1:b.y,x2:bandR,y2:b.y},g);
    const t = el("text",{x:bandL+16,y:b.y+22,fill:col(L.hex)},g);
    t.textContent = "L" + L.id + " · " + L.name;
    t.setAttribute("opacity",".8");
    if(b.sats){
      const sh = el("rect",{x:bandL,y:b.satY-13,width:bandR-bandL,height:SH+26},g);
      sh.style.fill = T().mix ? "#dfe6ef" : "#05080c"; sh.style.opacity = ".5";
      const dl = el("line",{x1:bandL,y1:b.satY-13,x2:bandR,y2:b.satY-13},g);
      dl.style.stroke = col(L.hex); dl.style.strokeDasharray = "1 7"; dl.style.opacity = ".3";
      const st = el("text",{x:bandL+16,y:b.satY+16,fill:col(L.hex)},g);
      st.textContent = "folhas";
      st.setAttribute("opacity",".42"); st.setAttribute("font-size","9");
    }
  });
  /* eixo do tronco */
  if(UI.center !== undefined && UI.totalH){
    const ax = el("line",{x1:UI.center,y1:-10,x2:UI.center,y2:UI.totalH+10},gB);
    ax.style.stroke = col("#4da3ff"); ax.style.strokeWidth = "1"; ax.style.opacity = ".10";
  }

  /* arestas — o que desce é forte, o que retorna corre nas canaletas e recua */
  vEdges().forEach(e => {
    const a = Store.nodes[e.from], b = Store.nodes[e.to];
    if(!a || !b) return;
    const ek = EDGE_KINDS[e.kind] || EDGE_KINDS.feeds;
    const isRet = UI.lanes[e.id] !== undefined;
    const isLeaf = a._sat || b._sat;
    const g = el("g",{},gE);
    const d = edgePath(a,b,e);
    el("path",{d, class:"edge-hit", "data-edge":e.id},g);
    const sel = isSel("edge",e.id);
    const p = el("path",{d, class:"edge", stroke:col(ek.hex),
      "stroke-dasharray":ek.dash, "marker-end":"url(#arw_"+e.kind+")", "data-edge":e.id},g);
    p.style.pointerEvents = "none";
    const isTrunk = a._trunk && b._trunk && !isRet;
    p.style.strokeWidth = (sel ? 3.2 : (isTrunk ? 3 : isRet ? 1.25 : isLeaf ? 1.35 : 2)) * Vis.edgeW;
    p.style.opacity     = sel ? 1   : (isTrunk ? 1 : isRet ? .38  : isLeaf ? .5   : .82);
    if(e.label && !isRet){
      const mx = (cxOf(a) + cxOf(b))/2, my = (a.y+nodeH(a) + b.y)/2;
      const tx = el("text",{x:mx,y:my,fill:col(ek.hex),"font-size":9,"text-anchor":"middle",
        "font-family":"var(--mono)","paint-order":"stroke","stroke":T().bgOut,"stroke-width":3},g);
      tx.textContent = e.label;
      tx.style.pointerEvents = "none";
      tx.style.opacity = isLeaf ? ".55" : ".85";
    }
  });

  /* nós */
  vNodes().forEach(n => {
    const K = KINDS[n.kind]; if(!K) return;
    const L = LAYER_BY_ID[K.layer];
    const w = nodeW(n), h = nodeH(n);
    const g = el("g",{class:"node-box" + (n._sat?" sat":"") + (n._trunk?" trunk":"")
      + (isSel("node",n.id)?" sel":"") + (Store.multi.has(n.id)?" msel":"")
      + (Vis.shape==="etiqueta"?" tag":""),
      transform:`translate(${n.x},${n.y})`, "data-node":n.id}, gN);
    const NC = col(nodeColor(n));
    el("rect",{class:"body",x:0,y:0,width:w,height:h,stroke:NC},g);
    el("rect",{x:0,y:0,width:n._sat?3:4,height:h,fill:NC},g);
    const fc = flowAccent(n);
    if(fc) el("rect",{x:0,y:0,width:w,height:3,fill:col(fc)},g);

    const S = Vis.show, meta = summarize(n);
    if(Vis.shape === "etiqueta"){
      const ti = el("text",{x:10,y:h/2,class:"node-title","dominant-baseline":"middle"},g);
      ti.textContent = (S.icon ? K.icon + " " : "") + trunc(n.label, 26);
    } else if(n._sat || Vis.shape === "barra"){
      const ti = el("text",{x:S.icon?26:12,y:S.kind||S.meta?19:h/2,class:"node-title","font-size":11,
        "dominant-baseline":(S.kind||S.meta)?"auto":"middle"},g);
      ti.textContent = trunc(n.label,22);
      if(S.icon){ const ic = el("text",{x:12,y:S.kind||S.meta?19:h/2,"font-size":10,fill:NC,
        "dominant-baseline":(S.kind||S.meta)?"auto":"middle"},g); ic.textContent = K.icon; }
      if((S.kind || S.meta) && h > 30){
        const kd = el("text",{x:12,y:33,class:"node-kind"},g);
        kd.textContent = trunc((S.kind?K.label:"") + (S.meta&&meta ? (S.kind?" · ":"") + meta : ""), 30);
      }
    } else {
      let ty = 22;
      if(S.kind){
        if(S.icon){ const ic = el("text",{x:14,y:ty,"font-size":12,fill:NC},g); ic.textContent = K.icon; }
        const kd = el("text",{x:S.icon?32:14,y:ty-1,class:"node-kind"},g); kd.textContent = K.label;
        ty += 17;
      } else if(S.icon){ const ic = el("text",{x:14,y:ty,"font-size":12,fill:NC},g); ic.textContent = K.icon; ty += 17; }
      if(S.label){ const ti = el("text",{x:14,y:ty,class:"node-title"},g); ti.textContent = trunc(n.label,24); ty += 13; }
      if(S.meta && meta && ty < h){ const mt = el("text",{x:14,y:ty,class:"node-meta"},g); mt.textContent = trunc(meta,30); }
    }
    if(Vis.show.flows && (n.flows||[]).length){
      (n.flows||[]).slice(0,6).forEach((fid,i) => {
        const f = flowById(fid); if(!f) return;
        el("rect",{x:w-8-i*6,y:h-6,width:4,height:4,fill:col(f.color)},g);
      });
    }

    if(n.pinned) el("circle",{cx:w-10,cy:10,r:3,fill:"var(--fg3)"},g);
    if(n.status === "issue") el("circle",{cx:w-10,cy:10,r:4,fill:"var(--err)"},g);
    if(n.status === "ai")    el("circle",{cx:w-10,cy:10,r:4,fill:"var(--accent2)"},g);
  });

  vp.setAttribute("transform", `translate(${View.tx},${View.ty}) scale(${View.k})`);
  document.getElementById("graphName").textContent = Store.name;
  syncViewUi();
}

/* pílula do recorte ativo + contagem visível vs total */
function syncViewUi(){
  const vn = vNodes().length, ve = vEdges().length;
  const tn = nodeList().length, te = edgeList().length;
  const st = document.getElementById("stats");
  if(st) st.textContent = (vn === tn ? `${tn} nós · ${te} arestas`
                                     : `${vn}/${tn} nós · ${ve}/${te} arestas`);
  const pill = document.getElementById("viewPill");
  if(!pill) return;
  const lbl = viewLabel();
  pill.style.display = lbl ? "block" : "none";
  if(lbl){
    const one = Store.view && Store.view.size === 1 ? flowById([...Store.view][0]) : null;
    pill.textContent = "▣ " + lbl + "  ✕";
    pill.style.borderColor = one ? one.color : "var(--accent)";
    pill.title = one && one.desc ? one.desc : "clique para ver o grafo inteiro";
  }
}

function edgePath(a,b,e){
  const wa = nodeW(a), ha = nodeH(a), wb = nodeW(b), hb = nodeH(b);
  const lane = e ? UI.lanes[e.id] : undefined;

  /* retorno: sai pela direita, sobe na canaleta, entra pela direita do destino */
  if(lane !== undefined){
    const sx = a.x + wa, sy = a.y + ha/2;
    const tx = b.x + wb, ty = b.y + hb/2;
    const r = 12, up = sy > ty ? 1 : -1;
    return `M${sx},${sy} H${lane-r} Q${lane},${sy} ${lane},${sy-up*r} `
         + `V${ty+up*r} Q${lane},${ty} ${lane-r},${ty} H${tx}`;
  }

  const ax = cxOf(a), bx = cxOf(b);

  /* mesma linha: arco raso por cima, para não cortar as caixas vizinhas */
  if(Math.abs(a.y - b.y) < 6){
    const toRight = ax < bx;
    const x1 = toRight ? a.x + wa : a.x;
    const x2 = toRight ? b.x : b.x + wb;
    const my = a.y + ha/2;
    const d = Math.min(70, Math.abs(x2-x1)*0.4 + 16);
    return `M${x1},${my} C${x1+(toRight?d:-d)},${my-24} ${x2-(toRight?d:-d)},${my-24} ${x2},${my}`;
  }

  /* descida normal */
  if(b.y > a.y){
    const y1 = a.y + ha, y2 = b.y, dy = Math.max(20,(y2-y1)*0.55);
    return `M${ax},${y1} C${ax},${y1+dy} ${bx},${y2-dy} ${bx},${y2}`;
  }
  const y1 = a.y, y2 = b.y + hb, dy = Math.max(20,(y1-y2)*0.55);
  return `M${ax},${y1} C${ax},${y1-dy} ${bx},${y2+dy} ${bx},${y2}`;
}

/* com um recorte ativo, o nó ganha uma barra fina na cor do fluxo — assim o
   mapa e a legenda da esquerda falam a mesma língua */
function flowAccent(n){
  if(!Store.view || Store.view.size !== 1) return null;
  const f = flowById([...Store.view][0]);
  return f && (n.flows||[]).includes(f.id) ? f.color : null;
}

function trunc(s,n){ s = String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function summarize(n){
  const K = KINDS[n.kind]; if(!K||!K.fields) return "";
  for(const f of K.fields){
    const v = n.props[f.key];
    if(v !== "" && v !== undefined && v !== null && v !== false && v !== 0) return String(v);
  }
  return "";
}
function isSel(type,id){ return Store.sel && Store.sel.type===type && Store.sel.id===id; }

function redraw(force){
  computeLayout(force);
  if(typeof Scene !== "undefined" && Scene.iso) exitIsolate();   // o grafo mudou: volta ao todo
  if(typeof Scene !== "undefined" && Scene.on){ layout3D(force); buildFocus(); if(force) fit3D(); }
  else render();
  refreshPanels();
}

/* ==========================================================================
   Interação
   ========================================================================== */
function svgPoint(evt){
  const r = svg.getBoundingClientRect();
  return { x:(evt.clientX-r.left-View.tx)/View.k, y:(evt.clientY-r.top-View.ty)/View.k };
}

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX-r.left, my = ev.clientY-r.top;
  const k2 = Math.min(2.6, Math.max(0.15, View.k * (ev.deltaY < 0 ? 1.12 : 1/1.12)));
  View.tx = mx - (mx-View.tx)*(k2/View.k);
  View.ty = my - (my-View.ty)*(k2/View.k);
  View.k = k2;
  vp.setAttribute("transform", `translate(${View.tx},${View.ty}) scale(${View.k})`);
}, {passive:false});

svg.addEventListener("mousedown", ev => {
  const nodeEl = ev.target.closest("[data-node]");
  const edgeEl = ev.target.closest("[data-edge]");

  if(UI.linking && nodeEl){
    const id = nodeEl.getAttribute("data-node");
    if(!UI.linkFrom){ UI.linkFrom = id; setHint("origem: " + Store.nodes[id].label + " — clique no destino (Esc cancela)"); }
    else if(UI.linkFrom !== id){ openEdgeDialog(UI.linkFrom, id); endLinking(); }
    return;
  }
  if(nodeEl && !ev.shiftKey){
    const id = nodeEl.getAttribute("data-node");
    if(ev.ctrlKey || ev.metaKey){ toggleMulti(id); return; }
    select("node", id);
    const p = svgPoint(ev);
    UI.drag = { id, dx: p.x - Store.nodes[id].x, dy: p.y - Store.nodes[id].y, moved:false };
    return;
  }
  if(edgeEl && !ev.shiftKey){ select("edge", edgeEl.getAttribute("data-edge")); return; }
  UI.pan = { x:ev.clientX, y:ev.clientY, tx:View.tx, ty:View.ty };
  svg.classList.add("panning");
  if(!nodeEl && !edgeEl) select(null);
});

window.addEventListener("mousemove", ev => {
  if(UI.drag){
    const p = svgPoint(ev), n = Store.nodes[UI.drag.id];
    if(!n) return;
    n.x = p.x - UI.drag.dx; n.y = p.y - UI.drag.dy; n.pinned = true; UI.drag.moved = true;
    render();
  } else if(UI.pan){
    View.tx = UI.pan.tx + (ev.clientX-UI.pan.x);
    View.ty = UI.pan.ty + (ev.clientY-UI.pan.y);
    vp.setAttribute("transform", `translate(${View.tx},${View.ty}) scale(${View.k})`);
  }
});
window.addEventListener("mouseup", () => {
  if(UI.drag && UI.drag.moved) Store.dirty = true;
  UI.drag = null; UI.pan = null; svg.classList.remove("panning");
});

window.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  const k = ev.key, low = k.toLowerCase();

  if(k==="Escape"){
    if(Vis.presentation){ togglePresentation(); return; }
    if(typeof Scene !== "undefined" && Scene.on && Scene.iso && !UI.linking){ exitIsolate(); return; }
    endLinking(); closeModal(); select(null); return;
  }
  if(k==="Delete"||k==="Backspace"){ deleteSelection(); ev.preventDefault(); return; }
  if(low==="l"){ toggleLinking(); return; }
  if(k==="\\"){ togglePresentation(); return; }

  if(typeof Scene !== "undefined" && Scene.on){
    /* 3D: setas deslocam, A/D giram, W/S inclinam, +/- aproximam */
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k)){ Scene.keys[k]=1; ev.preventDefault(); return; }
    if(low==="p"){ Scene.showPayload = !Scene.showPayload; syncPayloadUi(); return; }
    if(low==="m"){ Depth.meter = !Depth.meter; return; }
    if("adws".includes(low)){ Scene.keys[low]=1; return; }
    if(k==="+"||k==="="||k==="-"||k==="_"){ Scene.keys[k]=1; return; }
    if(low==="f"){ exitIsolate(); fit3D(); return; }
    if(low==="i"){ if(Scene.iso) exitIsolate();
                   else if(Store.sel && Store.sel.type==="node") enterIsolate(Store.sel.id,1); return; }
    if(k==="]"){ isoExpand(1); return; }
    if(k==="["){ isoExpand(-1); return; }
    if(low==="z"){ if(Store.sel && Store.sel.type==="node") focusNode(Store.sel.id); return; }
    if(low==="r"){ resetCam(); return; }
    if(low==="g"){ Scene.grid = !Scene.grid; document.getElementById("h3grid").classList.toggle("on",Scene.grid); return; }
    if(k==="1"){ viewPreset("iso"); } if(k==="2"){ viewPreset("top"); }
    if(k==="3"){ viewPreset("front"); } if(k==="4"){ viewPreset("side"); }
    if(low==="o"){ redraw(true); }
    return;
  }
  if(low==="a") redraw(true);
  if(low==="f") zoomFit();
});
window.addEventListener("keyup", ev => {
  if(typeof Scene === "undefined") return;
  const k = ev.key;
  delete Scene.keys[k]; delete Scene.keys[k.toLowerCase()];
});
window.addEventListener("blur", () => { if(typeof Scene !== "undefined") Scene.keys = {}; });

function selectLayer(L){
  Store.multi = new Set(vNodes().filter(n => layerOf(n) === L).map(n => n.id));
  Store.sel = null; Store.multiLayer = L;
  if(typeof buildFocus === "function") buildFocus();
  if(!Scene.on) render();
  refreshPanels();
}
function toggleMulti(id){
  if(Store.multi.has(id)) Store.multi.delete(id); else Store.multi.add(id);
  Store.sel = null; Store.multiLayer = null;
  if(!Scene.on) render();
  refreshPanels();
}
function clearMulti(){ Store.multi = new Set(); Store.multiLayer = null; }

function select(type,id){
  if(type) clearMulti();
  Store.sel = type ? {type,id} : null;
  if(typeof buildFocus === "function") buildFocus();
  if(!Scene.on) render();
  refreshPanels();
}
function deleteSelection(){
  if(!Store.sel) return;
  if(Store.sel.type==="node"){
    const n = Store.nodes[Store.sel.id];
    if(n && confirm(`Remover "${n.label}" e suas conexões?`)) removeNode(Store.sel.id);
  } else removeEdge(Store.sel.id);
  Store.sel = null; redraw();
}
function toggleLinking(){ UI.linking ? endLinking() : startLinking(); }
function startLinking(){
  UI.linking = true; UI.linkFrom = null;
  svg.classList.add("linking");
  document.getElementById("btnLink").classList.add("primary");
  setHint("modo conexão: clique na origem, depois no destino (Esc cancela)");
}
function endLinking(){
  UI.linking = false; UI.linkFrom = null;
  svg.classList.remove("linking");
  document.getElementById("btnLink").classList.remove("primary");
  clear(gT); setHint(null);
}
function setHint(msg){
  const d3 = (typeof Scene !== "undefined" && Scene.on);
  if(!msg && Store.view && Store.view.size && !vNodes().length){
    document.getElementById("hint").textContent =
      "recorte vazio — volte ao grafo inteiro, selecione um nó e use “+ incluir” na aba Fluxos";
    return;
  }
  const iso = d3 && Scene.iso;
  document.getElementById("hint").textContent = msg || (iso
    ? "isolado: " + (Store.nodes[Scene.iso.id] ? Store.nodes[Scene.iso.id].label : "") +
      " · duplo clique num vizinho isola ele · ] / [ mais ou menos saltos · Esc ou F volta ao todo"
    : d3
    ? "duplo clique isola o nó · arraste = deslocar · direito/shift = orbitar · roda = aproximar do cursor · A/D girar · W/S inclinar · F todo · P dados · M régua de profundidade · 1-4 vistas"
    : "eixo central = tronco · caixa grande = núcleo · caixa menor = folha · canaletas à direita = retorno   |   L conectar · A auto-layout · F fit");
}

function zoomFit(){
  const ns = nodeList(); if(!ns.length) return;
  const laneMax = Object.values(UI.lanes||{}).reduce((a,b)=>Math.max(a,b), 0);
  const x0 = Math.min(...ns.map(n=>n.x)) - 290;
  const x1 = Math.max(laneMax + 30, ...ns.map(n=>n.x+nodeW(n))) + 40;
  const y0 = Math.min(...ns.map(n=>n.y)) - 60;
  const y1 = Math.max(...ns.map(n=>n.y+nodeH(n))) + 60;
  const r = svg.getBoundingClientRect();
  const k = Math.min(r.width/(x1-x0), r.height/(y1-y0), 1.6);
  View.k = k; View.tx = -x0*k + (r.width-(x1-x0)*k)/2; View.ty = -y0*k + (r.height-(y1-y0)*k)/2;
  vp.setAttribute("transform", `translate(${View.tx},${View.ty}) scale(${View.k})`);
}
function zoomBy(f){
  const r = svg.getBoundingClientRect(), mx=r.width/2, my=r.height/2;
  const k2 = Math.min(2.6, Math.max(0.15, View.k*f));
  View.tx = mx-(mx-View.tx)*(k2/View.k); View.ty = my-(my-View.ty)*(k2/View.k); View.k = k2;
  vp.setAttribute("transform", `translate(${View.tx},${View.ty}) scale(${View.k})`);
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- fluxos ---------------- */

      <button id="fDel2" ${selNode?"":"disabled"}>− tirar do fluxo</button>

  }

    <div class="small" style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">
      Clique num fluxo para ver só o mapa dele. <b style="color:var(--fg2)">Ctrl+clique</b> soma fluxos.

  host.innerHTML = h;

  host.querySelectorAll("[data-flow]").forEach(row => row.addEventListener("click", ev => {

    refreshPanels();
  });
}

function flowDialog(f){

  openModal(isNew ? "Novo fluxo" : "Editar fluxo", `

    [{label:"Cancelar", fn:closeModal},

function renderTree(){
  const ns = vNodes();
  if(!ns.length) return `<div class="empty">Grafo vazio.<br>Use a paleta ou peça um esqueleto à IA.</div>`;
  const roots = ns.filter(n => vIn(n.id).filter(e => e.kind!=="monitors").length === 0);
  const seen = new Set();
  let out = "";
  const walk = (n, d) => {
    if(seen.has(n.id) || d > 12) return;
    seen.add(n.id);
    const L = LAYER_BY_ID[layerOf(n)];
    out += `<div class="tree-row ${isSel("node",n.id)?"sel":""}" data-sel="${n.id}" style="padding-left:${4+d*11}px">
      <i style="background:${L.hex}"></i><span>${esc(trunc(n.label,20))}</span>
      <span class="k">${esc(KINDS[n.kind].label)}</span></div>`;
    vOut(n.id).filter(e => e.kind!=="monitors")
      .map(e => Store.nodes[e.to]).filter(Boolean)
      .sort((a,b) => layerOf(a)-layerOf(b))
      .forEach(c => walk(c, d+1));
  };
  roots.sort((a,b) => layerOf(a)-layerOf(b)).forEach(r => walk(r,0));
  ns.filter(n => !seen.has(n.id)).forEach(n => walk(n,0));
  return out;
}

/* seletor da carga: mostra o que está inferido e deixa sobrescrever, no máximo 3 */
function payloadPicker(e){
  const cur = payloadOf(e);
  const auto = !(e.pl && e.pl.length);
  const groups = {};
  Object.entries(PAYLOADS).forEach(([id,P]) => (groups[P.g] = groups[P.g]||[]).push([id,P]));
  let h = `<div class="small" style="margin-bottom:5px">
      ${auto ? "inferido pelos tipos dos dois nós" : "definido à mão"} ·
      <span data-pl="" style="cursor:pointer;color:var(--accent)">${auto ? "" : "voltar ao automático"}</span></div>`;
  h += Object.entries(groups).map(([g, list]) =>
    `<div style="margin-bottom:5px"><div class="small" style="color:var(--fg3)">${esc(g)}</div>` +
    list.map(([id,P]) => {
      const on = cur.includes(id);
      return `<span class="pl-chip ${on?"on":""}" data-pl="${id}" title="${esc(P.label)}"
        style="border-color:${on?P.hex:"var(--line2)"};color:${on?P.hex:"var(--fg3)"}">${P.code}</span>`;
    }).join("") + `</div>`).join("");
  return h;
}

/* ==========================================================================
   Realce por propriedade — colorir o nó por um campo em vez de pela camada.
   Só campos categóricos (select) entram: são os que têm poucos valores.
   ========================================================================== */
const HL_PALETTE = ["#4da3ff","#ff9f45","#3ddc97","#ff6b6b","#c3e34b","#8b6cff",
                    "#2fd4c8","#ffc857","#e879f9","#f472b6","#38bdf8","#a0768f"];
function colorKeys(){
  const keys = new Map();
  Object.values(KINDS).forEach(K => (K.fields||[]).forEach(f => {
    if(f.type === "select") keys.set(f.key, (keys.get(f.key)||0) + 1);
  }));
  const used = {};
  nodeList().forEach(n => Object.keys(n.props||{}).forEach(k => {
    if(keys.has(k) && n.props[k] !== "" && n.props[k] != null) used[k] = (used[k]||0)+1;
  }));
  return Object.entries(used).sort((a,b) => b[1]-a[1]);
}
function colorScale(){
  if(!Vis.colorBy) return null;
  if(Vis.colorBy === "flow"){
    const m = new Map();
    Store.flows.forEach(f => m.set(f.id, f.color));
    return { kind:"flow", map:m };
  }
  const key = Vis.colorBy.replace(/^prop:/, "");
  const vals = [];
  nodeList().forEach(n => { const v = n.props && n.props[key];
    if(v !== "" && v != null && !vals.includes(String(v))) vals.push(String(v)); });
  vals.sort();
  const m = new Map();
  vals.forEach((v,i) => m.set(v, HL_PALETTE[i % HL_PALETTE.length]));
  return { kind:"prop", key, map:m };
}
let ColorScale = null;
function nodeColor(n){
  const L = LAYER_BY_ID[layerOf(n)];
  if(!ColorScale) return L.hex;
  if(ColorScale.kind === "flow"){
    const f = (n.flows||[])[0];
    return f && ColorScale.map.get(f) ? ColorScale.map.get(f) : "#6b7c8f";
  }
  const v = n.props ? n.props[ColorScale.key] : null;
  return (v != null && ColorScale.map.get(String(v))) || "#6b7c8f";
}

function applyVis(id, v){
  if(id === "spaceY") applySpacing(v, Vis.spaceR);
  else if(id === "spaceR") applySpacing(Vis.spaceY, v);
  else if(id === "depthq"){ setDepthQ(v); return; }
  else { Vis[id] = v; saveVis(); }
  if(id === "fontMin" && !Scene.on) render();
  if(id === "cardW" || id === "cardH"){ applyCardSize(); redraw(); }
  else if(id === "spaceY" || id === "spaceR"){ if(!Scene.on) redraw(); }
  else if(!Scene.on) render();
}

/* ==========================================================================
   Exportar a vista como imagem
   ========================================================================== */
function exportPng(){
  if(typeof Scene !== "undefined" && Scene.on){
    Scene.cv.toBlob(bl => {
      const u = URL.createObjectURL(bl), a = document.createElement("a");
      a.href = u; a.download = slug() + "-3d.png"; a.click();
      setTimeout(() => URL.revokeObjectURL(u), 2000);
    }, "image/png");
    return;
  }
  const svgTxt = buildSvgDoc();
  const img = new Image();
  const blob = new Blob([svgTxt], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const sc = 2;
    const cv = document.createElement("canvas");
    cv.width = img.width*sc; cv.height = img.height*sc;
    const c = cv.getContext("2d");
    c.fillStyle = getComputedStyle(document.body).getPropertyValue("--bg").trim() || "#0b0f14";
    c.fillRect(0,0,cv.width,cv.height);
    c.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(bl => {
      const u2 = URL.createObjectURL(bl), a = document.createElement("a");
      a.href = u2; a.download = slug() + "-2d.png"; a.click();
      setTimeout(() => URL.revokeObjectURL(u2), 2000);
    }, "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("não foi possível rasterizar o SVG"); };
  img.src = url;
}

/* SVG autocontido: o desenho usa classes CSS, então as regras e as variáveis
   do tema viajam junto — senão o arquivo abre sem cor nenhuma fora daqui */
const SVG_CSS = `
.node-box rect.body{fill:var(--bg3);stroke-width:1.5}
.node-box.trunk rect.body{fill:#1c2939;stroke-width:2.2}
.node-box.sat rect.body{fill:#121a24;stroke-opacity:.5}
.node-box.tag rect.body{fill:none;stroke:none}
.node-box.msel rect.body{stroke:#fff;stroke-width:2.2}
.node-box text{font-family:var(--sans)}
.node-title{font-size:12px;font-weight:600;fill:var(--fg)}
.node-box.trunk .node-title{fill:#fff}
.node-box.sat .node-title{fill:var(--fg2)}
.node-kind{font-size:9px;fill:var(--fg3);letter-spacing:.06em;text-transform:uppercase}
.node-box.sat .node-kind{fill:var(--fg3)}
.node-meta{font-size:9px;fill:var(--fg2);font-family:var(--mono)}
.edge{fill:none}
.edge-hit{display:none}
.band rect{fill:#ffffff;opacity:.014}
.band text{font-size:10px;fill:var(--fg3);letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.band line{stroke:var(--line);stroke-dasharray:2 6}`;

function buildSvgDoc(){
  const src = document.getElementById("svg");
  const clone = src.cloneNode(true);
  const vpc = clone.querySelector("#viewport");
  vpc.removeAttribute("transform");

  const ns = vNodes();
  let x0 = -300, y0 = -40, x1 = 900, y1 = 600;
  if(ns.length){
    x0 = Math.min(...ns.map(n => n.x)) - 300;
    x1 = Math.max(UI.contentRight || 0, ...ns.map(n => n.x + nodeW(n))) + 220;
    y0 = Math.min(...ns.map(n => n.y)) - 50;
    y1 = Math.max(...ns.map(n => n.y + nodeH(n))) + 50;
  }
  const w = Math.max(200, x1-x0), h = Math.max(200, y1-y0);
  clone.setAttribute("width", Math.round(w));
  clone.setAttribute("height", Math.round(h));
  clone.setAttribute("viewBox", `${Math.round(x0)} ${Math.round(y0)} ${Math.round(w)} ${Math.round(h)}`);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

  const cs = getComputedStyle(document.documentElement);
  const vars = ["--bg","--bg2","--bg3","--line","--line2","--fg","--fg2","--fg3","--mono","--sans"]
    .map(v => `${v}:${(document.body.classList.contains("light")
      ? getComputedStyle(document.body).getPropertyValue(v) : cs.getPropertyValue(v)).trim()}`).join(";");
  const style = document.createElementNS("http://www.w3.org/2000/svg","style");
  style.textContent = `:root{${vars}}\nsvg{background:var(--bg)}\n` + SVG_CSS;
  clone.insertBefore(style, clone.firstChild);

  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("x",x0); bg.setAttribute("y",y0);
  bg.setAttribute("width",w); bg.setAttribute("height",h);
  bg.setAttribute("fill", (document.body.classList.contains("light")
    ? getComputedStyle(document.body).getPropertyValue("--bg") : cs.getPropertyValue("--bg")).trim());
  clone.insertBefore(bg, style.nextSibling);

  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
}
function exportSvg(){
  if(typeof Scene !== "undefined" && Scene.on){ toast("SVG sai do modo 2D — o 3D exporta PNG"); return; }
  download(slug() + ".svg", buildSvgDoc(), "image/svg+xml;charset=utf-8");
}

    <label>Incluir num fluxo</label>
    ${Store.flows.length ? `<div>${Store.flows.map(f =>
      `<span class="flow-chip" data-mf="${f.id}" style="border-color:${f.color}"><i style="background:${f.color}"></i>${esc(f.name)}</span>`).join("")}</div>`
      : `<div class="small">nenhum fluxo definido</div>`}
    <label>Ações</label>
    <div style="display:grid;gap:5px">
      <button id="mPin">fixar posição 3D das ${ns.length}</button>
      <button id="mUnpin">soltar posição 3D</button>
      <button id="mDel" class="danger">excluir as ${ns.length}</button>
      <button id="mClear" class="ghost">limpar seleção</button>
    </div>`;

  host.querySelectorAll("[data-mf]").forEach(c => c.addEventListener("click", () => {
    const fid = c.getAttribute("data-mf");
    const allIn = ns.every(n => (n.flows||[]).includes(fid));
    ns.forEach(n => setFlowMember(n.id, fid, !allIn));
    redraw(); refreshPanels();
    toast((allIn ? "removidos de " : "incluídos em ") + (flowById(fid)||{}).name);
  }));
  const on = (id, fn) => { const b = host.querySelector("#"+id); if(b) b.onclick = fn; };
  on("mPin",   () => { ns.forEach(n => n.pin3 = true);  Store.dirty = true; refreshPanels(); });
  on("mUnpin", () => { ns.forEach(n => n.pin3 = false); Store.dirty = true; redraw(true); });
  on("mDel",   () => { if(confirm(`Excluir ${ns.length} nós e suas conexões?`)){
                          ids.forEach(removeNode); clearMulti(); redraw(true); } });
  on("mClear", () => { clearMulti(); refreshPanels(); if(!Scene.on) render(); });
}

/* grade 3×3 dos oito pontos de ancoragem; o centro é "auto" */
function anchorGrid(which, cur){
  const map = [7,0,1, 6,null,2, 5,4,3];
  const nm = ["N","NE","E","SE","S","SW","W","NW"];
  return `<div class="anchor-grid">` + map.map(i =>
    i === null
      ? `<div class="mid ${cur===null||cur===undefined?"on":""}" data-anchor="${which}" data-i="">auto</div>`
      : `<div class="${cur===i?"on":""}" data-anchor="${which}" data-i="${i}">${nm[i]}</div>`
  ).join("") + `</div>`;
}

function openEdgeDialog(from,to){
  const a = Store.nodes[from], b = Store.nodes[to];
  const la = layerOf(a), lb = layerOf(b);
  const suggested = suggestEdgeKind(a,b);
  const warn = lb < la ? `<div class="small" style="color:var(--warn);margin-top:8px">
     Sentido ascendente (L${la} → L${lb}). Legítimo apenas como retorno — observação, exec report ou hedge.</div>` : "";
  openModal("Nova relação", `
    <div class="small">${esc(a.label)} <b style="color:var(--fg)">→</b> ${esc(b.label)}</div>
    <label>Tipo de relação</label>
    <select id="mKind">${Object.entries(EDGE_KINDS).map(([k,v]) =>
      `<option value="${k}" ${k===suggested?"selected":""}>${v.label} — ${v.desc}</option>`).join("")}</select>
    <label>Rótulo (opcional)</label><input id="mLabel" placeholder="ex: IV ATM, delta líquido">
    ${warn}`,
    [{label:"Cancelar",fn:closeModal},
     {label:"Criar",primary:true,fn:()=>{
        addEdge(from,to,document.getElementById("mKind").value,document.getElementById("mLabel").value);
        closeModal(); redraw();
     }}]);
}
function suggestEdgeKind(a,b){
  const la = layerOf(a), lb = layerOf(b);
  if(la === 7) return "constrains";
  if(la === 8 || lb === 8) return "monitors";
  if(la === 1) return "references";
  if(lb === 3) return "computes";
  if(lb === 4) return "triggers";
  if(la === 5 && lb === 5) return "composes";
  if(la >= 5 && lb >= 6) return "routes";
  return "feeds";
}

/* ==========================================================================
   Validação estrutural
   ========================================================================== */
function validate(){
  const issues = [];
  const ns = nodeList(), es = edgeList();
  const add = (sev,msg,nodeId,fix) => issues.push({sev,msg,nodeId,fix});
  const kindsPresent = k => ns.filter(n => n.kind === k);
  const has = k => kindsPresent(k).length > 0;

  if(!ns.length){ return [{sev:"info",msg:"Grafo vazio. Comece pela exchange — nada existe antes dela.",nodeId:null}]; }

  /* 1 · raiz */
  if(!has("exchange")) add("error","Nenhuma <b>Exchange</b> no grafo. Todo fluxo começa no local de negociação.");

  /* 2 · nós sem fonte */
  ns.forEach(n => {
    const L = layerOf(n);
    if(L >= 2 && L <= 6 && inEdges(n.id).filter(e => e.kind!=="monitors").length === 0)
      add("warn", `<b>${esc(n.label)}</b> não recebe nada. Um nó de L${L} sem fonte é premissa escondida.`, n.id);
    if(L === 7 && inEdges(n.id).length === 0)
      add("info", `<b>${esc(n.label)}</b> não recebe nenhuma medição. O limite existe no papel, mas nada o avalia em runtime.`, n.id);
  });

  /* 3 · nós isolados */
  ns.forEach(n => {
    if(!inEdges(n.id).length && !outEdges(n.id).length && n.kind !== "exchange")
      add("warn", `<b>${esc(n.label)}</b> está desconectado do grafo.`, n.id);
  });

  /* 4 · inversão de camada */
  es.forEach(e => {
    const a = Store.nodes[e.from], b = Store.nodes[e.to];
    if(!a||!b) return;
    const la = layerOf(a), lb = layerOf(b);
    if(lb < la && !["monitors","constrains","hedges","routes"].includes(e.kind))
      add("warn", `<b>${esc(a.label)}</b> (L${la}) → <b>${esc(b.label)}</b> (L${lb}) inverte a direção das camadas com relação "${EDGE_KINDS[e.kind].label}". Retorno legítimo usa observa, restringe, protege ou roteia.`, a.id);
  });

  /* 5 · ciclos no fluxo direto (arestas de retorno declaradas ficam de fora) */
  const cyc = findCycle(es.filter(e => {
    const a = Store.nodes[e.from], b = Store.nodes[e.to];
    if(!a||!b) return false;
    if(["monitors","constrains"].includes(e.kind)) return false;
    return layerOf(a) <= layerOf(b);
  }));
  if(cyc) add("error", `Ciclo no fluxo direto: ${cyc.map(id => esc(Store.nodes[id]?Store.nodes[id].label:id)).join(" → ")}. Realimentação precisa ser marcada como observa.`, cyc[0]);

  /* 6 · ordem sem risco (direto ou por ancestral) */
  ns.filter(n => ["order","orderIntent","executionPlan"].includes(n.kind)).forEach(n => {
    const anc = reachableTo(n.id);
    const gated = [...anc].some(id => layerOf(Store.nodes[id] || {kind:"order"}) === 7);
    if(!gated) add("error", `<b>${esc(n.label)}</b> não passa por nenhum nó de risco. Nenhuma ordem deve sair sem gate.`, n.id);
  });

  /* 7 · ordem sem gateway de saída */
  if(has("order") && !has("oeGateway"))
    add("error","Existem ordens mas nenhum <b>OE Gateway</b>. O caminho até a bolsa está aberto no vazio.");

  /* 8 · pernas e estruturas */
  ns.filter(n => n.kind === "leg").forEach(n => {
    const parent = inEdges(n.id).some(e => ["structure","strategy"].includes((Store.nodes[e.from]||{}).kind));
    if(!parent) add("error", `Perna <b>${esc(n.label)}</b> não pertence a nenhuma estrutura ou estratégia.`, n.id);
    const inst = inEdges(n.id).some(e => ["optionSeries","instrument","futuresContract","underlying"].includes((Store.nodes[e.from]||{}).kind));
    if(!inst) add("warn", `Perna <b>${esc(n.label)}</b> não referencia um instrumento concreto. "Vender a call" não é executável.`, n.id);
  });
  ns.filter(n => n.kind === "structure").forEach(n => {
    const legs = outEdges(n.id).filter(e => (Store.nodes[e.to]||{}).kind === "leg").length
               + inEdges(n.id).filter(e => (Store.nodes[e.from]||{}).kind === "leg").length;
    if(legs < 2) add("warn", `Estrutura <b>${esc(n.label)}</b> tem ${legs} perna(s). Uma estrutura só faz sentido com duas ou mais.`, n.id);
  });

  /* 9 · estratégia incompleta */
  ns.filter(n => n.kind === "strategy").forEach(n => {
    const reach = reachable(n.id);
    const need = [
      ["trigger","gatilho — sem ele a estratégia nunca acorda"],
      ["exitRule","regra de saída — entrada sem saída não é estratégia"],
      ["sizing","dimensionamento — sem size, não há risco definido"],
    ];
    need.forEach(([k,why]) => {
      if(!ns.some(m => m.kind===k && (reach.has(m.id) || reachableTo(n.id).has(m.id))))
        add("warn", `<b>${esc(n.label)}</b> não tem ${why}.`, n.id);
    });
  });

  /* 10 · opções: cadeia de precificação */
  const optish = ns.some(n => ["optionSeries","optionChain"].includes(n.kind))
              || ns.some(n => n.kind==="instrument" && n.props.assetClass==="opção");
  if(optish){
    if(!has("pricingModel")) add("error","Há opções no grafo mas nenhum <b>modelo de precificação</b>. Sem ele não existe IV nem greek.");
    if(!has("ivSolver") && !has("greeks")) add("warn","Opções sem <b>solver de IV</b> nem <b>greeks</b>: a posição fica sem sensibilidade conhecida.");
    if(!has("calendar")) add("info","Sem <b>calendário</b>, a contagem de dias até o vencimento — e o theta — fica implícita.");
  }
  ns.filter(n => ["greeks","ivSolver"].includes(n.kind)).forEach(n => {
    const src = inEdges(n.id).some(e => (Store.nodes[e.from]||{}).kind === "pricingModel");
    if(!src) add("warn", `<b>${esc(n.label)}</b> não recebe de um modelo de precificação. Greek sem modelo é número sem premissa.`, n.id);
  });

  /* 11 · venda de volatilidade */
  const shortVol = ns.some(n => n.kind==="strategy" && /volatilidade/i.test(n.props.style||"") && /venda/i.test(n.props.style||""))
                || ns.some(n => n.kind==="structure" && n.props.side === "vendida");
  if(shortVol){
    if(!has("volMonitor")) add("error","Estrutura vendida em volatilidade sem <b>monitor de volatilidade</b>. É o radar de quem está vendido em vega.");
    if(!has("greekLimit")) add("warn","Sem <b>limite de greeks</b>, a venda de vol não tem teto de gamma nem de vega.");
    if(!has("marginModel")) add("warn","Sem <b>modelo de margem</b>, o retorno da estrutura vendida não tem denominador.");
    if(!has("volEstimator")) add("info","Sem <b>vol realizada</b>, não há régua para dizer que a IV está cara.");
  }

  /* 12 · daytrade sem stop temporal */
  ns.filter(n => n.kind==="strategy" && n.props.horizon==="daytrade").forEach(n => {
    const exits = ns.filter(m => m.kind==="exitRule");
    if(exits.length && !exits.some(m => m.props.forceFlat || m.props.type==="fim de sessão" || m.props.type==="por tempo"))
      add("warn", `<b>${esc(n.label)}</b> é daytrade mas nenhuma saída zera na sessão.`, n.id);
  });

  /* 13 · execução sem retorno */
  if(has("order") && !has("execReport"))
    add("warn","Ordens sem <b>exec report</b>: a posição vira suposição em vez de fato.");
  if(has("position") && !has("pnl"))
    add("info","Há posição mas nenhum <b>P&L</b> — sem atribuição, não se aprende com o resultado.");

  /* 14 · observabilidade */
  if(ns.length > 8 && !ns.some(n => layerOf(n) === 8))
    add("info","Nenhum nó de operação (gravação, monitor, alerta). Arquitetura sem observabilidade só falha em silêncio.");

  /* 15 · rótulos duplicados */
  const seen = {};
  ns.forEach(n => { const k = n.kind+"|"+n.label.toLowerCase(); if(seen[k]) add("info",`Dois nós "${esc(n.label)}" do mesmo tipo.`,n.id); seen[k]=1; });

  return issues;
}

function reachable(id){
  const out = new Set(), st = [id];
  while(st.length){ const c = st.pop();
    outEdges(c).forEach(e => { if(!out.has(e.to)){ out.add(e.to); st.push(e.to); } }); }
  return out;
}
function reachableTo(id){
  const out = new Set(), st = [id];
  while(st.length){ const c = st.pop();
    inEdges(c).forEach(e => { if(!out.has(e.from)){ out.add(e.from); st.push(e.from); } }); }
  return out;
}
function findCycle(es){
  const adj = {}; es.forEach(e => (adj[e.from] = adj[e.from]||[]).push(e.to));
  const color = {}, stack = [];
  let found = null;
  const dfs = id => {
    if(found) return;
    color[id] = 1; stack.push(id);
    (adj[id]||[]).forEach(t => {
      if(found) return;
      if(color[t] === 1){ found = stack.slice(stack.indexOf(t)).concat([t]); }
      else if(!color[t]) dfs(t);
    });
    stack.pop(); color[id] = 2;
  };
  Object.keys(Store.nodes).forEach(id => { if(!color[id]) dfs(id); });
  return found;
}

function renderIssues(){
  const iss = validate();
  nodeList().forEach(n => { if(n.status === "issue") n.status = "ok"; });
  iss.forEach(i => { if(i.nodeId && Store.nodes[i.nodeId] && i.sev !== "info") Store.nodes[i.nodeId].status = "issue"; });
  render();
  const c = {error:0,warn:0,info:0}; iss.forEach(i => c[i.sev]++);
  if(!iss.length) return `<div class="empty">Nenhum problema estrutural encontrado.</div>`;
  return `<div style="display:flex;gap:6px;margin-bottom:10px">
      <span class="chip" style="color:var(--err)">${c.error} erro</span>
      <span class="chip" style="color:var(--warn)">${c.warn} aviso</span>
      <span class="chip" style="color:var(--accent)">${c.info} nota</span></div>` +
    ["error","warn","info"].flatMap(s => iss.filter(i => i.sev===s).map(i =>
      `<div class="issue ${s}" ${i.nodeId?`data-goto="${i.nodeId}"`:""}>${i.msg}
        ${i.nodeId&&Store.nodes[i.nodeId]?`<div class="where">→ ${esc(Store.nodes[i.nodeId].label)}</div>`:""}</div>`)).join("");
}
function bindIssues(host){
  host.querySelectorAll("[data-goto]").forEach(x => x.addEventListener("click", () => {
    const id = x.getAttribute("data-goto");

}
