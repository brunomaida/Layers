function sanitizeId(id){ return "n_" + id.replace(/[^a-zA-Z0-9_]/g,"_"); }

function toMermaid(essential){
  const ns = vNodes();
  if(!ns.length) return "flowchart TD\n  vazio[\"grafo vazio\"]";
  let out = "flowchart TD\n";
  const byLayer = {};
  ns.forEach(n => (byLayer[layerOf(n)] = byLayer[layerOf(n)]||[]).push(n));
  const occupied = Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  occupied.forEach(L => {
    const lay = LAYER_BY_ID[L];
    out += `  subgraph lay${L}["L${L} · ${lay.name}"]\n    direction LR\n`;
    byLayer[L].forEach(n => {
      const meta = summarize(n);
      const clean = s => String(s).replace(/"/g,"'").replace(/[\[\]{}()|]/g," ");
      const txt = `${KINDS[n.kind].icon} ${clean(n.label)}` + (meta ? `<br/>${clean(meta)}` : "");
      out += `    ${sanitizeId(n.id)}["${txt}"]:::c${L}\n`;
    });
    out += "  end\n";
  });
  // âncoras invisíveis: forçam o empilhamento das camadas na ordem certa
  if(occupied.length > 1)
    out += "\n  " + occupied.map(L => "lay"+L).join(" ~~~ ") + "\n";
  out += "\n";
  vEdges().forEach(e => {
    if(!Store.nodes[e.from] || !Store.nodes[e.to]) return;
    if(essential && ["monitors","references"].includes(e.kind)) return;
    const ek = EDGE_KINDS[e.kind];
    const arrow = (e.kind==="monitors"||e.kind==="references") ? "-.->"
                : (e.kind==="routes") ? "==>" : "-->";
    const pls = payloadOf(e).map(p => PAYLOADS[p].code).join("/");
    const lbl = ((pls ? pls + " · " : "") + (e.label ? `${ek.label}: ${e.label}` : ek.label))
      .replace(/[|\[\]{}()]/g,"/");
    out += `  ${sanitizeId(e.from)} ${arrow}|${lbl}| ${sanitizeId(e.to)}\n`;
  });
  out += "\n";
  LAYERS.forEach(L => { out += `  classDef c${L.id} fill:#161f2c,stroke:${L.hex},color:#dbe6f0,stroke-width:1.5px;\n`; });
  return out;
}

function toAscii(){
  const ns = vNodes();
  const now = new Date().toISOString().slice(0,16).replace("T"," ");
  const vl = viewLabel();
  let out = `# ${Store.name}${vl ? " — " + vl : ""}\n\n`
          + `> MarketView — arquitetura de estratégia · gerado em ${now}\n`
          + `> ${ns.length} nós · ${vEdges().length} relações`
          + (vl ? ` · recorte: **${vl}** (de ${nodeList().length} nós no grafo completo)` : "") + `\n\n`;
  if(vl && Store.view.size === 1){
    const f = flowById([...Store.view][0]);
    if(f && f.desc) out += `> ${f.desc}\n\n`;
  }

  out += "## Fluxo por camada\n\n```\n";
  const byLayer = {};
  ns.forEach(n => (byLayer[layerOf(n)] = byLayer[layerOf(n)]||[]).push(n));
  Object.keys(byLayer).map(Number).sort((a,b)=>a-b).forEach(L => {
    const lay = LAYER_BY_ID[L];
    out += `┌─ L${L} · ${lay.name.toUpperCase()} ${"─".repeat(Math.max(2,52-lay.name.length))}\n`;
    byLayer[L].forEach(n => {
      const meta = summarize(n);
      out += `│  ${KINDS[n.kind].icon} ${n.label}${meta?"  ·  "+meta:""}\n`;
      out += `│     [${n.kind}]\n`;
      vOut(n.id).forEach(e => {
        const t = Store.nodes[e.to]; if(!t) return;
        out += `│     └─${EDGE_KINDS[e.kind].label}→ ${t.label}${e.label?" ("+e.label+")":""}\n`;
      });
    });
    out += "│\n";
  });
  out += "```\n\n";

  out += "## Hierarquia\n\n```\n";
  const roots = ns.filter(n => vIn(n.id).filter(e=>e.kind!=="monitors").length===0);
  const seen = new Set();
  const walk = (n, prefix, last, d) => {
    if(d > 14) return;
    const dup = seen.has(n.id);
    out += prefix + (prefix ? (last ? "└── " : "├── ") : "") + n.label + `  [${n.kind}]` + (dup ? "  ↩" : "") + "\n";
    if(dup) return;
    seen.add(n.id);
    const kids = vOut(n.id).filter(e=>e.kind!=="monitors").map(e=>Store.nodes[e.to]).filter(Boolean);
    kids.forEach((c,i) => walk(c, prefix + (prefix ? (last ? "    " : "│   ") : ""), i===kids.length-1, d+1));
  };
  roots.forEach(r => walk(r,"",true,0));
  ns.filter(n=>!seen.has(n.id)).forEach(n => walk(n,"",true,0));
  out += "```\n\n";

  out += "## Nós\n\n| Camada | Tipo | Nome | Propriedades |\n|---|---|---|---|\n";
  ns.sort((a,b)=>layerOf(a)-layerOf(b)).forEach(n => {
    const props = Object.entries(n.props).filter(([,v]) => v!==""&&v!==null&&v!==undefined)
      .map(([k,v]) => `${k}=${v}`).join(", ");
    out += `| L${layerOf(n)} ${LAYER_BY_ID[layerOf(n)].name} | ${n.kind} | ${n.label} | ${props||"—"} |\n`;
  });

  out += "\n## Relações\n\n| Origem | Relação | Destino | Trafega | Nota |\n|---|---|---|---|---|\n";
  vEdges().forEach(e => {
    const a = Store.nodes[e.from], b = Store.nodes[e.to]; if(!a||!b) return;
    const pls = payloadOf(e).map(p => PAYLOADS[p].code).join(" ");
    out += `| ${a.label} | ${EDGE_KINDS[e.kind].label} | ${b.label} | ${pls||"—"} | ${e.label||"—"} |\n`;
  });

  const inUse = payloadsInView();
  if(inUse.length){
    out += "\n## Cargas\n\nO que trafega nos conectores deste recorte.\n\n| Código | Significado | Relações |\n|---|---|---|\n";
    inUse.forEach(([p,n]) => out += `| ${PAYLOADS[p].code} | ${PAYLOADS[p].label} | ${n} |\n`);
  }

  if(Store.flows.length){
    out += "\n## Fluxos\n\nRegras de negócio mapeadas sobre o grafo. Um nó pertence a quantos fluxos fizer sentido.\n\n";
    out += "| Fluxo | Nós | Cobre |\n|---|---|---|\n";
    Store.flows.forEach(f => {
      out += `| ${f.name} | ${flowNodes(f.id).length} | ${f.desc||"—"} |\n`;
    });
    Store.flows.forEach(f => {
      const mem = flowNodes(f.id);
      if(!mem.length) return;
      out += `\n**${f.name}** — ${mem.sort((a,b)=>layerOf(a)-layerOf(b)).map(n => n.label).join(" · ")}\n`;
    });
  }

  const iss = validate();
  if(iss.length){
    out += "\n## Validação\n\nA validação é sempre do grafo inteiro, não do recorte.\n\n";
    iss.forEach(i => out += `- **${i.sev.toUpperCase()}** ${i.msg.replace(/<[^>]+>/g,"")}\n`);
  }
  return out;
}

function toJson(){
  return JSON.stringify({
    format:"marketview/1", name:Store.name, savedAt:new Date().toISOString(),
    flows:Store.flows.map(f => ({id:f.id,name:f.name,color:f.color,desc:f.desc})),
    nodes:nodeList().map(n => ({id:n.id,kind:n.kind,label:n.label,props:n.props,notes:n.notes,flows:(n.flows||[]),
      x:n.x,y:n.y,pinned:n.pinned, p3:n.p3||null, pin3:!!n.pin3})),
    edges:edgeList().map(e => ({id:e.id,from:e.from,to:e.to,kind:e.kind,label:e.label,
      a1:(e.a1===undefined?null:e.a1), a2:(e.a2===undefined?null:e.a2), pl:(e.pl&&e.pl.length?e.pl:null)})),
  }, null, 2);
}

function loadJson(txt){
  const d = JSON.parse(txt);
  Store.nodes = {}; Store.edges = {}; Store.sel = null; Store.seq = 1;
  Store.flows = Array.isArray(d.flows) ? d.flows.map(f => ({id:f.id, name:f.name||"fluxo",
    color:f.color||FLOW_COLORS[0], desc:f.desc||""})) : [];
  Store.view = null;
  Store.name = d.name || "arquitetura importada";
  (d.nodes||[]).forEach(n => { if(KINDS[n.kind]) Store.nodes[n.id] = {
    id:n.id,kind:n.kind,label:n.label||KINDS[n.kind].label,
    props:Object.assign(defaultProps(n.kind),n.props||{}),notes:n.notes||"",status:"ok",
    flows:Array.isArray(n.flows)?n.flows.slice():[],
    x:n.x,y:n.y,pinned:!!n.pinned, p3:n.p3||undefined, pin3:!!n.pin3 }; });
  (d.edges||[]).forEach(e => { const id = e.id||uid("e");
    if(Store.nodes[e.from]&&Store.nodes[e.to])
      Store.edges[id] = {id,from:e.from,to:e.to,kind:EDGE_KINDS[e.kind]?e.kind:"feeds",label:e.label||"",
        a1:(e.a1===undefined?null:e.a1), a2:(e.a2===undefined?null:e.a2),
        pl:Array.isArray(e.pl)?e.pl.filter(p=>PAYLOADS[p]):null}; });
  redraw(true);
  if(typeof Scene !== "undefined" && Scene.on) fit3D(); else zoomFit();
}

  model: localStorage.getItem("mv_model") || "claude-sonnet-4-5",

};

function taxonomySpec(){
  return LAYERS.map(L => {
    const ks = Object.entries(KINDS).filter(([,k]) => k.layer === L.id);
    return `L${L.id} ${L.name} — ${L.desc}\n` +
      ks.map(([id,k]) => `  ${id}: ${k.label} — ${k.desc}` +
        (k.fields&&k.fields.length ? ` | campos: ${k.fields.map(f=>f.key).join(", ")}` : "")).join("\n");
  }).join("\n") +
  "\n\nCARGAS (o que trafega numa relação; use o identificador, não o código):\n" +
  Object.entries(PAYLOADS).map(([k,v]) => `  ${k} (${v.code}): ${v.label}`).join("\n") +
  "\n\nRELAÇÕES (tipo de aresta):\n" +
  Object.entries(EDGE_KINDS).map(([k,v]) => `  ${k}: ${v.label} — ${v.desc}`).join("\n");
}

function graphSpec(){
  const ns = nodeList();
  if(!ns.length) return "(grafo vazio)";
  let s = "";
  if(Store.flows.length){
    s += "FLUXOS (regras de negócio; um nó pertence a vários):\n";
    Store.flows.forEach(f => {
      s += `  ${f.id} "${f.name}" — ${f.desc||"sem descrição"} (${flowNodes(f.id).length} nós)\n`;
    });
  }
  s += "NÓS:\n";
  ns.sort((a,b)=>layerOf(a)-layerOf(b)).forEach(n => {
    const props = Object.entries(n.props).filter(([,v])=>v!==""&&v!==null&&v!==undefined&&v!==false)
      .map(([k,v])=>`${k}=${v}`).join("; ");
    const fl = (n.flows||[]).length ? ` <fluxos: ${n.flows.join(",")}>` : "";
    s += `  ${n.id} [${n.kind} · L${layerOf(n)}] "${n.label}"${props?" {"+props+"}":""}${fl}${n.notes?" // "+n.notes:""}\n`;
  });
  s += "ARESTAS:\n";
  edgeList().forEach(e => {
    const a = Store.nodes[e.from], b = Store.nodes[e.to]; if(!a||!b) return;
    s += `  ${e.id}: ${e.from} "${a.label}" --${e.kind}--> ${e.to} "${b.label}"${e.label?" ("+e.label+")":""}\n`;
  });
  return s;
}

const SYSTEM_PROMPT = () => `Você é arquiteto de sistemas de trading, revisando o grafo de uma estratégia no MarketView.

O grafo é hierárquico e em camadas: cada nó pertence a uma camada fixa determinada pelo seu tipo, e o fluxo natural desce da camada 0 para a 8. Subir de camada só é legítimo como retorno: observa (monitors), restringe (constrains), protege (hedges) ou roteia ordem de volta ao venue (routes).

Além das camadas existem FLUXOS: recortes nomeados que atravessam o grafo e correspondem a regras de negócio do sistema de trading — "recepção de dados de mercado", "envio e recebimento de ordens", "controle de risco antes do envio", "gravação de dados", "formação de candles e book", "cálculo de indicadores", "criação de estratégias", "execução em backtest", "redundância hot-path", "ações manuais do admin", "aplicações client". Um nó pertence a quantos fluxos fizer sentido. Um fluxo bom é o menor conjunto de nós que conta uma história completa de ponta a ponta: se falta um elo, o mapa daquele fluxo fica quebrado; se sobra, vira o grafo inteiro de novo.

TAXONOMIA DISPONÍVEL — use exclusivamente estes identificadores de tipo:
${taxonomySpec()}

PRINCÍPIOS QUE VOCÊ DEVE APLICAR AO REVISAR:
- Nenhuma ordem sai sem passar por um nó de risco. Isso não é preferência de estilo.
- Toda perna aponta para um instrumento concreto (série de opção, contrato, ação). "Vender a call" não é executável.
- Greek ou IV sem modelo de precificação declarado é número sem premissa.
- Estrutura vendida em volatilidade exige monitor de vol, limite de greeks e modelo de margem.
- Estratégia sem gatilho nunca acorda; sem regra de saída não é estratégia; sem sizing não tem risco definido.
- Backtest sem custo, latência e modelo de fila mede outra coisa.
- Prefira poucos nós com responsabilidade clara a muitos nós redundantes. Se dois nós fazem a mesma coisa, diga qual remover.
- Se o usuário modelou algo de um jeito defensável mas diferente do seu, diga isso em vez de reescrever.

RESPONDA APENAS COM UM OBJETO JSON, sem texto antes ou depois, sem cercas de código:
{
  "resumo": "2 a 5 frases sobre o estado da arquitetura e o que muda com este patch",
  "achados": [
    {"severidade":"erro|aviso|nota","no":"<id existente, ou null>","mensagem":"o que está errado","recomendacao":"o que fazer"}
  ],
  "patch": {
    "novosNos":[{"tmp":"t1","tipo":"<kind>","rotulo":"nome curto","props":{},"notas":"por que existe"}],
    "novasArestas":[{"de":"<id existente ou tmp>","para":"<id existente ou tmp>","tipo":"<edge kind>","rotulo":"","dados":["<código de carga>"]}],
    "atualizarNos":[{"id":"<id existente>","rotulo":"...","tipo":"<kind, só se realocar>","props":{}}],
    "removerNos":["<id>"],
    "removerArestas":["<id>"],
    "novosFluxos":[{"tmp":"f1","nome":"Recepção de dados de mercado","descricao":"a regra em uma frase"}],
    "atribuirFluxos":[{"no":"<id ou tmp>","fluxos":["<id de fluxo existente, tmp de fluxo novo, ou nome>"]}]
  },
  "perguntas":["pergunta ao usuário, quando faltar informação para decidir"]
}
Campos vazios podem ser omitidos. Nunca invente ids: para nós novos use "tmp".`;

async function callClaude(userPrompt){
  if(!AI.key){ openSettings("Configure a chave da API para usar a IA."); return null; }
  AI.busy = true; renderRight();
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":AI.key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",
      },
      body: JSON.stringify({
        model: AI.model,
        max_tokens: AI.maxTokens,
        system: SYSTEM_PROMPT(),
        messages:[{role:"user",content:userPrompt}],
      }),
    });
    const raw = await res.text();
    if(!res.ok){
      let msg = raw;
      try{ msg = JSON.parse(raw).error.message; }catch(_){}
      throw new Error(`HTTP ${res.status} — ${msg}`);
    }
    const data = JSON.parse(raw);
    const text = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    const parsed = extractJson(text);
    AI.last = parsed || { resumo: text, achados:[], patch:{} };
    AI.last._usage = data.usage;
    AI.log.unshift({ when:new Date().toLocaleTimeString(), summary: AI.last.resumo || "(sem resumo)" });
    AI.log = AI.log.slice(0,8);
    return AI.last;
  }catch(err){
    AI.last = { resumo:"", erro: String(err.message||err), achados:[], patch:{} };
    return AI.last;
  }finally{
    AI.busy = false; renderRight();
  }
}

function extractJson(text){
  if(!text) return null;
  let t = text.trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
  try{ return JSON.parse(t); }catch(_){}
  const i = t.indexOf("{"); if(i < 0) return null;
  for(let j = t.length; j > i; j--){
    const s = t.slice(i,j);
    if(s.trim().endsWith("}")){ try{ return JSON.parse(s); }catch(_){} }
  }
  return null;
}

/* ---------------- aplicação do patch ---------------- */
function resolveRef(ref, tmpMap){
  if(!ref) return null;
  if(tmpMap[ref]) return tmpMap[ref];
  if(Store.nodes[ref]) return ref;
  const byLabel = nodeList().find(n => n.label.toLowerCase() === String(ref).toLowerCase());
  if(byLabel) return byLabel.id;
  const byKind = nodeList().find(n => n.kind === ref);
  return byKind ? byKind.id : null;
}

function describePatch(p){
  if(!p) return "<div class='small'>Nenhuma alteração proposta.</div>";
  const L = [];
  (p.novosNos||[]).forEach(n => L.push(`<span class="diff-add">+ nó</span> ${esc(n.rotulo||n.tipo)} <span class="small">[${esc(n.tipo)}${KINDS[n.tipo]?" · L"+KINDS[n.tipo].layer:" · TIPO DESCONHECIDO"}]</span>`));
  (p.novasArestas||[]).forEach(e => L.push(`<span class="diff-add">+ aresta</span> ${esc(e.de)} —${esc(e.tipo||"feeds")}→ ${esc(e.para)}`));
  (p.atualizarNos||[]).forEach(u => L.push(`<span class="diff-mod">~ nó</span> ${esc((Store.nodes[u.id]||{}).label||u.id)}${u.tipo?` → realocar para <b>${esc(u.tipo)}</b>`:""}${u.rotulo?` → "${esc(u.rotulo)}"`:""}`));
  (p.removerNos||[]).forEach(id => L.push(`<span class="diff-del">− nó</span> ${esc((Store.nodes[id]||{}).label||id)}`));
  (p.removerArestas||[]).forEach(id => { const e = Store.edges[id];
    L.push(`<span class="diff-del">− aresta</span> ${esc(e?((Store.nodes[e.from]||{}).label+" → "+(Store.nodes[e.to]||{}).label):id)}`); });
  (p.novosFluxos||[]).forEach(f => L.push(`<span class="diff-add">+ fluxo</span> ${esc(f.nome||f.name||"?")}`));
  (p.atribuirFluxos||[]).forEach(a => {
    const n = Store.nodes[a.no] || nodeList().find(x => x.label.toLowerCase() === String(a.no||"").toLowerCase());
    L.push(`<span class="diff-mod">▣ fluxo</span> ${esc(n?n.label:a.no)} → ${esc((a.fluxos||a.flows||[]).join(", "))}`);
  });
  return L.length ? `<div style="font-family:var(--mono);font-size:11px;line-height:1.8">${L.join("<br>")}</div>`
                  : "<div class='small'>Nenhuma alteração proposta.</div>";
}

function applyPatch(p){
  if(!p) return;
  const tmp = {};
  let added = 0, linked = 0, changed = 0, removed = 0, skipped = [];

  (p.novosNos||[]).forEach(n => {
    if(!KINDS[n.tipo]){ skipped.push(`tipo desconhecido: ${n.tipo}`); return; }
    const node = addNode(n.tipo, n.rotulo, n.props||{}, {notes:n.notas||""});
    node.status = "ai";
    if(n.tmp) tmp[n.tmp] = node.id;
    added++;
  });
  (p.atualizarNos||[]).forEach(u => {
    const n = Store.nodes[u.id]; if(!n) { skipped.push(`id inexistente: ${u.id}`); return; }
    if(u.tipo && KINDS[u.tipo] && u.tipo !== n.kind){ n.kind = u.tipo; n.props = Object.assign(defaultProps(u.tipo), u.props||{}); n.pinned = false; }
    else if(u.props) Object.assign(n.props, u.props);
    if(u.rotulo) n.label = u.rotulo;
    if(u.notas) n.notes = u.notas;
    n.status = "ai"; changed++;
  });
  (p.novasArestas||[]).forEach(e => {
    const a = resolveRef(e.de,tmp), b = resolveRef(e.para,tmp);
    if(!a||!b){ skipped.push(`aresta não resolvida: ${e.de} → ${e.para}`); return; }
    const ne = addEdge(a,b,EDGE_KINDS[e.tipo]?e.tipo:"feeds",e.rotulo||"");
    if(ne){ linked++;
      const dd = (e.dados || e.payload || []).filter(p => PAYLOADS[p]);
      if(dd.length) ne.pl = dd;
    }
  });
  (p.removerArestas||[]).forEach(id => { if(Store.edges[id]){ removeEdge(id); removed++; } });
  (p.removerNos||[]).forEach(id => { if(Store.nodes[id]){ removeNode(id); removed++; } });

  /* fluxos */
  const ftmp = {};
  let flowsAdded = 0, assigned = 0;
  (p.novosFluxos||[]).forEach(f => {
    const nome = (f.nome || f.name || "").trim();
    if(!nome) return;
    const exists = Store.flows.find(x => x.name.toLowerCase() === nome.toLowerCase());
    const nf = exists || addFlow(nome, null, f.descricao || f.desc || "");
    if(!exists) flowsAdded++;
    if(f.tmp) ftmp[f.tmp] = nf.id;
    ftmp[nome.toLowerCase()] = nf.id;
  });
  const resolveFlow = ref => {
    if(!ref) return null;
    if(ftmp[ref]) return ftmp[ref];
    if(flowById(ref)) return ref;
    const byName = Store.flows.find(x => x.name.toLowerCase() === String(ref).toLowerCase());
    return byName ? byName.id : null;
  };
  (p.atribuirFluxos||[]).forEach(a => {
    const nid = resolveRef(a.no || a.node, tmp);
    if(!nid){ skipped.push(`nó não resolvido para fluxo: ${a.no}`); return; }
    (a.fluxos || a.flows || []).forEach(fr => {
      const fid = resolveFlow(fr);
      if(!fid){ skipped.push(`fluxo desconhecido: ${fr}`); return; }
      setFlowMember(nid, fid, true); assigned++;
    });
  });
  if(flowsAdded || assigned) changed += 0;

  redraw(true); if(typeof Scene !== "undefined" && Scene.on) fit3D(); else zoomFit();
  toast(`${added} nós · ${linked} relações · ${changed} ajustes · ${removed} remoções`
      + (flowsAdded ? ` · ${flowsAdded} fluxos` : "") + (assigned ? ` · ${assigned} filiações` : "")
      + (skipped.length ? ` · ${skipped.length} ignorado(s)` : ""));
  if(skipped.length) console.warn("MarketView — itens ignorados do patch:", skipped);
}

        <div class="small" style="margin-top:6px">Chave inválida, modelo inexistente ou bloqueio de rede. Confira em Configurar.</div></div>`;
    } else {
      h += `<label>Resposta</label><div class="ai-msg">${esc(AI.last.resumo||"")}</div>`;
      const ach = AI.last.achados||[];
      if(ach.length){
        h += `<label>Achados (${ach.length})</label>` + ach.map(a => {
          const sev = /erro/i.test(a.severidade)?"error":/aviso/i.test(a.severidade)?"warn":"info";
          return `<div class="issue ${sev}" ${a.no?`data-goto="${esc(a.no)}"`:""}>
            <b>${esc(a.mensagem||"")}</b>${a.recomendacao?`<br>${esc(a.recomendacao)}`:""}
            ${a.no&&Store.nodes[a.no]?`<div class="where">→ ${esc(Store.nodes[a.no].label)}</div>`:""}</div>`;
        }).join("");
      }
      const p = AI.last.patch;
      const any = p && ((p.novosNos||[]).length||(p.novasArestas||[]).length||(p.atualizarNos||[]).length
        ||(p.removerNos||[]).length||(p.removerArestas||[]).length
        ||(p.novosFluxos||[]).length||(p.atribuirFluxos||[]).length);
      if(any){
        h += `<label>Patch proposto</label>${describePatch(p)}
          <div style="display:flex;gap:6px;margin-top:8px">
            <button id="aiApply" class="primary" style="flex:1">Aplicar</button>
            <button id="aiDiscard">Descartar</button></div>`;
      }
      const q = AI.last.perguntas||[];
      if(q.length) h += `<label>Perguntas</label>` + q.map(x=>`<div class="issue info">${esc(x)}</div>`).join("");
      if(AI.last._usage) h += `<div class="small" style="margin-top:10px">tokens: ${AI.last._usage.input_tokens} entrada · ${AI.last._usage.output_tokens} saída</div>`;
    }
  }
  if(AI.log.length) h += `<label>Sessão</label>` + AI.log.map(l =>
    `<div class="small" style="margin-bottom:4px"><span style="color:var(--fg3)">${esc(l.when)}</span> ${esc(trunc(l.summary,90))}</div>`).join("");

  host.innerHTML = h;

  const pr = host.querySelector("#aiPrompt");
  pr.addEventListener("input", () => AI.draft = pr.value);
  host.querySelector("#aiSettings").addEventListener("click", () => openSettings());
  host.querySelector("#aiSuggest").addEventListener("click", () => runAi("suggest", pr.value));
  host.querySelector("#aiReview").addEventListener("click", () => runAi("review", pr.value));
  host.querySelector("#aiGaps").addEventListener("click", () => runAi("gaps", pr.value));
  host.querySelector("#aiChallenge").addEventListener("click", () => runAi("challenge", pr.value));
  host.querySelector("#aiFlows").addEventListener("click", () => runAi("flows", pr.value));
  const ap = host.querySelector("#aiApply");
  if(ap){
    ap.addEventListener("click", () => { applyPatch(AI.last.patch); AI.last.patch = {}; renderRight(); });
    host.querySelector("#aiDiscard").addEventListener("click", () => { AI.last = null; renderRight(); });
  }
  bindIssues(host);
}

  review:    inst => `Revise a arquitetura inteira. Aponte nós mal alocados na camada, relações no sentido errado, redundâncias e lacunas que quebram a estratégia na prática. Proponha o patch mínimo que corrige.${inst?"\n\nContexto adicional: "+inst:""}`,
  gaps:      inst => `Liste o que falta para esta arquitetura funcionar em produção — não o que seria bom ter, mas o que a impede de operar com segurança. Priorize por consequência. Proponha os nós faltantes.${inst?"\n\nContexto adicional: "+inst:""}`,
  flows: inst => `Mapeie os fluxos de negócio deste grafo. Para cada fluxo que já existe, diga se o conjunto de nós está completo — falta algum elo para a história fechar de ponta a ponta? sobra algum que não pertence? Proponha os fluxos que faltam para cobrir o sistema, e atribua os nós. Não crie nós novos a menos que um fluxo fique impossível sem eles.${inst?"\\n\\nContexto adicional: "+inst:""}`,
  challenge: inst => `Contest e esta arquitetura. Assuma que ela vai perder dinheiro e explique por onde. Aponte premissas escondidas, nós que parecem certos e não são, e o que a estrutura mede que não é o que ela pensa medir. Só proponha patch se a correção for evidente.${inst?"\n\nContexto adicional: "+inst:""}`,
};

async function runAi(mode, inst){
  const prompt = `GRAFO ATUAL (${nodeList().length} nós, ${edgeList().length} arestas), nome "${Store.name}":\n\n${graphSpec()}\n\n---\nTAREFA: ${MODES[mode](inst&&inst.trim())}`;
  await callClaude(prompt);
  renderRight();
}

function openSettings(msg){
  openModal("Configuração da IA", `
    ${msg?`<div class="issue warn" style="margin-bottom:12px">${esc(msg)}</div>`:""}
    <label>Chave da API Anthropic</label>
    <input id="sKey" type="password" value="${esc(AI.key)}" placeholder="sk-ant-...">
    <div class="small" style="margin-top:6px">Guardada apenas no localStorage deste navegador e enviada só para api.anthropic.com.
    Como a página roda em file://, a chamada usa o cabeçalho de acesso direto do browser — qualquer extensão instalada
    tem acesso ao mesmo contexto, então use uma chave dedicada e com limite de gasto.</div>
    <label>Modelo</label>
    <input id="sModel" list="mList" value="${esc(AI.model)}" placeholder="claude-sonnet-4-5">
    <datalist id="mList">${AI.models.map(m=>`<option value="${esc(m)}">`).join("")}</datalist>
    <div style="margin-top:6px"><button id="sFetch">Listar modelos disponíveis na conta</button>
      <span class="small" id="sFetchMsg"></span></div>
    <label>Máximo de tokens por resposta</label>
    <input id="sMax" type="number" value="${AI.maxTokens}" min="1024" max="32000" step="1000">`,
    [{label:"Cancelar",fn:closeModal},
     {label:"Salvar",primary:true,fn:()=>{
        AI.key = document.getElementById("sKey").value.trim();
        AI.model = document.getElementById("sModel").value.trim() || "claude-sonnet-4-5";
        AI.maxTokens = parseInt(document.getElementById("sMax").value,10) || 8000;
        localStorage.setItem("mv_apikey",AI.key);
        localStorage.setItem("mv_model",AI.model);
        localStorage.setItem("mv_maxtok",String(AI.maxTokens));
        closeModal(); renderRight(); toast("configuração salva");
     }}]);
  document.getElementById("sFetch").addEventListener("click", async () => {
    const msgEl = document.getElementById("sFetchMsg");
    const key = document.getElementById("sKey").value.trim();
    if(!key){ msgEl.textContent = " informe a chave primeiro"; return; }
    msgEl.textContent = " consultando…";
    try{
      const r = await fetch("https://api.anthropic.com/v1/models?limit=100",{
        headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}});
      const d = await r.json();
      if(!r.ok) throw new Error(d.error?d.error.message:("HTTP "+r.status));
      AI.models = (d.data||[]).map(m=>m.id);
      localStorage.setItem("mv_models", JSON.stringify(AI.models));
      document.getElementById("mList").innerHTML = AI.models.map(m=>`<option value="${esc(m)}">`).join("");
      if(AI.models.length) document.getElementById("sModel").value = AI.models[0];
      msgEl.textContent = ` ${AI.models.length} modelos`;
    }catch(err){ msgEl.textContent = " " + String(err.message||err); }
  });
}

/* ==========================================================================
   MarketView 3D — cena, câmera orbital, cartões legíveis de qualquer ângulo,
   conectores ancorados em 8 pontos, foco com escurecimento e fluxo animado.
   Renderizador próprio sobre Canvas 2D: sem dependência, sem build, texto nítido.
   ========================================================================== */

const V3 = {
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x}),
  len:a=>Math.hypot(a.x,a.y,a.z),
  norm:a=>{ const l=Math.hypot(a.x,a.y,a.z)||1; return {x:a.x/l,y:a.y/l,z:a.z/l}; },
  lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, z:a.z+(b.z-a.z)*t}),
};

/* dimensões do mundo */
let CARD_W = 13, CARD_H = 4.4;
const LEVEL_H = 7.6, RING_MIN = 33;

const Cam = {
  tgt:{x:0,y:-55,z:0}, dist:170, yaw:0.7, pitch:-0.52,
  gTgt:{x:0,y:-55,z:0}, gDist:170, gYaw:0.7, gPitch:-0.52,   // alvo suavizado
  fov: 52*Math.PI/180,
};

const Scene = {
  on:false, cv:null, ctx:null, w:0, h:0, dpr:1,
  hover:null, drag:null, orbit:null, pan:null,
  grid:true, autoRot:false, raf:null, t0:0, iso:null, showPayload:true,
  proj:{}, rects:{},           // id -> projeção / retângulo de tela
  related:null, flow:[], flowCycle:1,
  keys:{},
};

/* ---------- projeção ---------- */
function camEye(){
  const { tgt, dist, yaw, pitch } = Cam;
  return { x: tgt.x + dist*Math.cos(pitch)*Math.sin(yaw),
           y: tgt.y - dist*Math.sin(pitch),
           z: tgt.z + dist*Math.cos(pitch)*Math.cos(yaw) };
}
function camBasis(){
  const eye = camEye();
  const fwd = V3.norm(V3.sub(Cam.tgt, eye));
  const right = V3.norm(V3.cross(fwd, {x:0,y:1,z:0}));
  const up = V3.cross(right, fwd);
  return { eye, fwd, right, up };
}
function project(p, B){
  const d = V3.sub(p, B.eye);
  const cz = V3.dot(d, B.fwd);
  if(cz < 1.2) return null;
  const f = 1/Math.tan(Cam.fov/2);
  const k = (f/cz) * (Scene.h/2);
  return { x: Scene.w/2 + V3.dot(d,B.right)*k,
           y: Scene.h/2 - V3.dot(d,B.up)*k,
           z: cz, s: k };
}

/* ==========================================================================
   Layout tridimensional — sem camadas fixas.
   Profundidade vem do grafo (caminho mais longo desde uma origem); o tronco
   desce pelo eixo central e cada nível abre suas ramificações em anel,
   com o setor angular herdado da subárvore. Ramo vira fatia vertical.
   ========================================================================== */
function layout3D(force){
  const ns = vNodes(); if(!ns.length) return;
  const { adj, radj, topo } = downwardDag();

  const depth = {};
  topo.forEach(id => { const p = radj[id];
    depth[id] = p.length ? 1 + Math.max(...p.map(m => depth[m]||0)) : 0; });
  Scene.depth = depth;

  /* árvore geradora: pai é o antecessor mais profundo — o mais próximo no fluxo */
  const parent = {};
  topo.forEach(id => {
    const p = radj[id];
    if(!p.length){ parent[id] = null; return; }
    let best = p[0];
    p.forEach(m => { if((depth[m]||0) > (depth[best]||0)) best = m; });
    parent[id] = best;
  });
  const kids = {}; ns.forEach(n => kids[n.id] = []);
  ns.forEach(n => { const p = parent[n.id]; if(p && kids[p]) kids[p].push(n.id); });

  const weight = {};
  topo.slice().reverse().forEach(id => {
    weight[id] = kids[id].length ? kids[id].reduce((a,c)=>a+(weight[c]||1),0) : 1;
  });

  /* setores angulares por subárvore */
  const ang = {};
  const assign = (id, a0, a1, guard) => {
    if(guard > 200) return;
    ang[id] = (a0+a1)/2;
    const kk = kids[id].slice().sort((x,y)=>(weight[y]||1)-(weight[x]||1));
    const w = kk.reduce((a,c)=>a+(weight[c]||1),0) || 1;
    let c0 = a0;
    kk.forEach(c => { const span = (a1-a0)*(weight[c]||1)/w; assign(c, c0, c0+span, guard+1); c0 += span; });
  };
  const roots = ns.filter(n => !parent[n.id]).map(n => n.id);
  const tw = roots.reduce((a,c)=>a+(weight[c]||1),0) || 1;
  let acc = 0;
  roots.forEach(r => { const span = 2*Math.PI*(weight[r]||1)/tw; assign(r, acc, acc+span, 0); acc += span; });

  /* posiciona nível a nível */
  const byD = {};
  ns.forEach(n => (byD[depth[n.id]||0] = byD[depth[n.id]||0] || []).push(n));
  const put = (n,x,y,z) => { if(force || !n.pin3 || !n.p3) n.p3 = {x,y,z}; };

  Object.keys(byD).map(Number).sort((a,b)=>a-b).forEach(d => {
    const row = byD[d];
    const center = row.find(n => n._trunk);
    const ring = row.filter(n => n !== center);
    const y = -d * LEVEL_H * Vis.spaceY;
    if(center) put(center, 0, y, 0);
    if(!ring.length) return;

    const r = Math.max(RING_MIN, ring.length * CARD_W * 1.35 / (2*Math.PI)) * Vis.spaceR;
    if(Vis.ringOrder === "camada")
      ring.sort((a,b) => layerOf(a) - layerOf(b) || (ang[a.id]||0) - (ang[b.id]||0) || a.id.localeCompare(b.id));
    else
      ring.sort((a,b) => (ang[a.id]||0) - (ang[b.id]||0) || a.id.localeCompare(b.id));
    const step = 2*Math.PI/ring.length;
    let bestOff = 0, bestErr = Infinity;
    for(let k=0;k<ring.length;k++){
      let err = 0;
      ring.forEach((n,i) => {
        const want = ang[n.id]||0, got = (k+i)*step;
        err += Math.abs(((want-got+Math.PI*3) % (2*Math.PI)) - Math.PI);
      });
      if(err < bestErr){ bestErr = err; bestOff = k; }
    }
    ring.forEach((n,i) => {
      const a = (bestOff + i)*step;
      put(n, Math.cos(a)*r, y, Math.sin(a)*r);
    });
  });

  Scene.maxDepth = Math.max(0, ...Object.values(depth));
  if(force) Scene.needFit = true;
}

/* ==========================================================================
   Âncoras: 8 pontos no perímetro do cartão (N NE E SE S SW W NW)
   ========================================================================== */
const ANCHORS = ["N","NE","E","SE","S","SW","W","NW"];
const ANCHOR_DIR = [[0,-1],[.7,-.7],[1,0],[.7,.7],[0,1],[-.7,.7],[-1,0],[-.7,-.7]];

function anchorPoint(R, i){
  const hx = R.w/2, hy = R.h/2, cx = R.x, cy = R.y;
  switch(i){
    case 0: return {x:cx,      y:cy-hy};
    case 1: return {x:cx+hx,   y:cy-hy};
    case 2: return {x:cx+hx,   y:cy};
    case 3: return {x:cx+hx,   y:cy+hy};
    case 4: return {x:cx,      y:cy+hy};
    case 5: return {x:cx-hx,   y:cy+hy};
    case 6: return {x:cx-hx,   y:cy};
    default:return {x:cx-hx,   y:cy-hy};
  }
}
function autoAnchor(R, other){
  const dx = other.x - R.x, dy = other.y - R.y;
  let best = 0, bv = -Infinity;
  ANCHOR_DIR.forEach((d,i) => {
    const v = (d[0]*dx + d[1]*dy) / (Math.hypot(dx,dy)||1);
    if(v > bv){ bv = v; best = i; }
  });
  return best;
}
function bez(p0,p1,p2,p3,t){
  const u=1-t, a=u*u*u, b=3*u*u*t, c=3*u*t*t, d=t*t*t;
  return { x:a*p0.x+b*p1.x+c*p2.x+d*p3.x, y:a*p0.y+b*p1.y+c*p2.y+d*p3.y };
}
function edgeCurve(Ra, Rb, e){
  const ia = (e.a1 === null || e.a1 === undefined) ? autoAnchor(Ra, Rb) : e.a1;
  const ib = (e.a2 === null || e.a2 === undefined) ? autoAnchor(Rb, Ra) : e.a2;
  const p0 = anchorPoint(Ra, ia), p3 = anchorPoint(Rb, ib);
  const k = Math.min(140, Math.max(24, Math.hypot(p3.x-p0.x, p3.y-p0.y)*0.38)) * Vis.curve;
  const da = ANCHOR_DIR[ia], db = ANCHOR_DIR[ib];
  return { p0, p1:{x:p0.x+da[0]*k, y:p0.y+da[1]*k},
               p2:{x:p3.x+db[0]*k, y:p3.y+db[1]*k}, p3 };
}

/* ==========================================================================
   Foco: parentesco transitivo + fluxo animado
   ========================================================================== */
function buildFocus(){
  Scene.related = null; Scene.flow = []; Scene.neighbors = null; Scene.kin = null;
  if(!Store.sel || Store.sel.type !== "node") return;
  const id = Store.sel.id; if(!Store.nodes[id]) return;

  const dDown = {[id]:0}, dUp = {[id]:0};
  let q = [id];
  while(q.length){ const c = q.shift();
    vOut(c).forEach(e => { if(dDown[e.to] === undefined){ dDown[e.to] = dDown[c]+1; q.push(e.to); } }); }
  q = [id];
  while(q.length){ const c = q.shift();
    vIn(c).forEach(e => { if(dUp[e.from] === undefined){ dUp[e.from] = dUp[c]+1; q.push(e.from); } }); }

  const rel = new Set([...Object.keys(dDown), ...Object.keys(dUp)]);
  Scene.related = rel;
  Scene.kin = { down:dDown, up:dUp };

  /* O fluxo anima só o que sai e o que entra no nó selecionado. Propagar por
     várias gerações enchia a tela e escondia justamente o que importa ver. */
  Scene.neighbors = new Map();                          // id -> tipo da relação que o liga
  vEdges().forEach(e => {
    if(e.from !== id && e.to !== id) return;
    Scene.flow.push({ id:e.id, phase:0 });
    Scene.flow.push({ id:e.id, phase:0.5 });
    const other = e.from === id ? e.to : e.from;
    if(!Scene.neighbors.has(other)) Scene.neighbors.set(other, e.kind);
  });
  Scene.flowCycle = 1.5;
}

/* Grau de parentesco e a opacidade que ele merece. Num DAG denso quase tudo é
   parente do nó central — então o foco é gradual, não binário: o que está perto
   fica aceso, o que está longe apaga aos poucos, e o alheio some. */
function kinGen(id){
  if(!Scene.kin) return null;
  const a = Scene.kin.down[id], b = Scene.kin.up[id];
  const g = Math.min(a === undefined ? Infinity : a, b === undefined ? Infinity : b);
  return g;
}
const KIN_A = [1, 0.95, 0.72, 0.52, 0.38, 0.28];
function kinAlpha(g){
  if(g === null) return 1;
  if(!isFinite(g)) return 0.085;
  return KIN_A[Math.min(g, KIN_A.length-1)];
}

/* ==========================================================================
   Isolamento — tira o nó do meio do grafo e o mostra sozinho com quem o toca.
   As posições do isolamento vivem à parte; o layout global fica intacto.
   ========================================================================== */
const ISO_Y = 14;

function posOf(n){ return Scene.iso ? Scene.iso.pos[n.id] : n.p3; }

function enterIsolate(id, hops){
  if(!Store.nodes[id]) return;
  hops = Math.max(1, Math.min(4, hops || 1));

  const gen = { [id]:0 }, dir = { [id]:0 };
  let frontier = [id];
  for(let h=0; h<hops; h++){
    const next = [];
    frontier.forEach(c => {
      inEdges(c).forEach(e => { if(gen[e.from] === undefined){
        gen[e.from] = h+1; dir[e.from] = dir[c] === 0 ?  1 : dir[c]; next.push(e.from); } });
      outEdges(c).forEach(e => { if(gen[e.to] === undefined){
        gen[e.to] = h+1; dir[e.to] = dir[c] === 0 ? -1 : dir[c]; next.push(e.to); } });
    });
    frontier = next;
  }

  /* quem alimenta fica acima, quem consome fica abaixo, um anel por geração */
  const pos = { [id]: {x:0, y:0, z:0} };
  const groups = {};
  Object.keys(gen).forEach(k => { if(k === id) return;
    (groups[dir[k] + "|" + gen[k]] = groups[dir[k] + "|" + gen[k]] || []).push(k); });
  Object.entries(groups).forEach(([key, ids]) => {
    const [d, g] = key.split("|").map(Number);
    const r = Math.max(21, ids.length * CARD_W * 1.4 / (2*Math.PI)) * Vis.spaceR;
    ids.sort();
    ids.forEach((nid,i) => {
      const a = i/ids.length * 2*Math.PI + (g % 2 ? 0.42 : 0);
      pos[nid] = { x: Math.cos(a)*r, y: d*g*ISO_Y*Vis.spaceY, z: Math.sin(a)*r };
    });
  });

  Scene.iso = { id, hops, set: new Set(Object.keys(gen)), pos, gen, dir };
  select("node", id);
  fit3D();
  syncIsoUi();
}

function isoExpand(delta){
  if(!Scene.iso) return;
  enterIsolate(Scene.iso.id, Scene.iso.hops + delta);
}
function exitIsolate(){
  if(!Scene.iso) return;
  Scene.iso = null; syncIsoUi(); fit3D();
}
/* legenda dos códigos presentes no recorte atual — o selo fica curto porque
   a decodificação mora aqui, e não em cima da aresta */
function syncPayloadUi(){
  const el = document.getElementById("legend3d");
  if(!el) return;
  const on = Scene.on && Scene.showPayload;
  const items = on ? payloadsInView() : [];
  el.style.display = (on && items.length) ? "flex" : "none";
  if(!on || !items.length) return;
  const CAP = 12;
  const shown = items.slice(0, CAP), rest = items.length - shown.length;
  el.innerHTML = `<div class="lgh">o que trafega${rest > 0 ? ` — ${shown.length} de ${items.length} tipos` : ""}</div>` +
    shown.map(([p]) => {
      const P = PAYLOADS[p];
      return `<span class="lg"><b style="color:${P.hex};border-color:${P.hex}">${P.code}</b>${esc(P.label)}</span>`;
    }).join("") +
    (rest > 0 ? `<span class="lg" style="color:var(--fg3)">+${rest} no inspector de cada relação</span>` : "");
  const b = document.getElementById("h3pl");
  if(b) b.classList.toggle("on", Scene.showPayload);
}

/* slider lateral: entrada contínua da intensidade; a régua (M) é a leitura */
function bindDepthBar(){
  const bar = document.getElementById("depthbar");
  const track = document.getElementById("dTrack");
  if(!bar || !track || bar.dataset.bound) return;
  bar.dataset.bound = "1";

  const ticks = bar.querySelector(".dticks");
  ticks.innerHTML = DEPTH_PRESETS.map(p =>
    `<i style="bottom:${p.q*100}%" title="${p.name}"></i>`).join("");

  const fromY = ev => {
    const r = track.getBoundingClientRect();
    return 1 - (ev.clientY - r.top)/r.height;
  };
  /* sem setPointerCapture: com captura no próprio trilho, o clique seguinte ao
     arrasto era engolido. Move e up ficam na janela, que é o padrão seguro. */
  let dragging = false;
  track.addEventListener("pointerdown", ev => {
    dragging = true; setDepthQ(fromY(ev)); ev.preventDefault();
  });
  window.addEventListener("pointermove", ev => { if(dragging) setDepthQ(fromY(ev)); });
  const stop = () => { dragging = false; };
  window.addEventListener("pointerup", stop);
  window.addEventListener("pointercancel", stop);
  track.addEventListener("dblclick", () => setDepthQ(0.5));
  bar.addEventListener("wheel", ev => {
    ev.preventDefault();
    setDepthQ(Depth.q + (ev.deltaY < 0 ? 0.02 : -0.02));
  }, {passive:false});
}

function syncIsoUi(){
  const b = document.getElementById("h3iso");
  if(!b) return;
  b.textContent = Scene.iso ? ("voltar ao todo · " + Scene.iso.hops + " salto" + (Scene.iso.hops>1?"s":"")) : "isolar";
  b.classList.toggle("on", !!Scene.iso);
  setHint(null);
}

/* ==========================================================================
   Render
   ========================================================================== */
function resize3D(){
  const box = document.getElementById("center").getBoundingClientRect();
  Scene.dpr = Math.min(2, window.devicePixelRatio || 1);
  Scene.w = Math.max(1, box.width); Scene.h = Math.max(1, box.height);
  Scene.cv.width = Scene.w * Scene.dpr; Scene.cv.height = Scene.h * Scene.dpr;
  Scene.cv.style.width = Scene.w + "px"; Scene.cv.style.height = Scene.h + "px";
  Scene.ctx.setTransform(Scene.dpr,0,0,Scene.dpr,0,0);
}

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
/* ==========================================================================
   Tema — os tokens que o canvas e o SVG consomem. O CSS tem os seus próprios
   em :root; aqui ficam os que o desenho precisa em JS.
   ========================================================================== */
const THEMES = {
  escuro:{ air:"#070b10", bgIn:"#0e151f", bgOut:"#05080c",
           card:"#1e2a3a", cardBot:"#121a25", trunk:"#27374d", trunkBot:"#16202e",
           sat:"#15202c", satBot:"#121a25", dimTop:"#0d131b", dimBot:"#080d13",
           text:"226,236,246", textDim:"150,172,195", textFaint:"140,160,180",
           shadow:0.55, grid:"77,163,255", badge:"7,11,16", mix:0 },
  claro:{  air:"#eef3f8", bgIn:"#ffffff", bgOut:"#e6ecf3",
           card:"#ffffff", cardBot:"#f1f5fa", trunk:"#e8f0fe", trunkBot:"#dbe7f8",
           sat:"#f7f9fc", satBot:"#eef3f8", dimTop:"#f2f6fa", dimBot:"#e9eef5",
           text:"18,30,44", textDim:"84,102,122", textFaint:"124,142,162",
           shadow:0.16, grid:"40,90,150", badge:"255,255,255", mix:0.42 },
};
const Theme = { name: localStorage.getItem("mv_theme") || "escuro" };
function T(){ return THEMES[Theme.name] || THEMES.escuro; }
/* cor de acento ajustada ao tema: a paleta foi feita para fundo escuro, então
   no claro ela precisa escurecer para manter contraste */
function col(hex){ const m = T().mix; return m ? mixHex(hex, m, "#0a1018") : hex; }
function setTheme(name){
  Theme.name = THEMES[name] ? name : "escuro";
  localStorage.setItem("mv_theme", Theme.name);
  document.body.classList.toggle("light", Theme.name === "claro");
  if(typeof Scene !== "undefined" && !Scene.on) render();
  refreshPanels();
}

/* mistura com o ar: é assim que a distância se lê de verdade — o objeto longe
   perde contraste contra o fundo, não vira fantasma transparente */
function mixHex(hex, t, into){
  const a = parseInt(hex.slice(1),16), b = parseInt((into||T().air).slice(1),16);
  const r = Math.round(((a>>16)&255)*(1-t) + ((b>>16)&255)*t);
  const g = Math.round(((a>>8)&255)*(1-t)  + ((b>>8)&255)*t);
  const l = Math.round((a&255)*(1-t)       + (b&255)*t);
  return `rgb(${r},${g},${l})`;
}
function mixA(hex, t, alpha){
  const a = parseInt(hex.slice(1),16), b = parseInt(T().air.slice(1),16);
  const r = Math.round(((a>>16)&255)*(1-t) + ((b>>16)&255)*t);
  const g = Math.round(((a>>8)&255)*(1-t)  + ((b>>8)&255)*t);
  const l = Math.round((a&255)*(1-t)       + (b&255)*t);
  return `rgba(${r},${g},${l},${alpha})`;
}

/* ==========================================================================
   Medidor de profundidade
   ========================================================================== */
/* Uma intensidade contínua q em [0,1] governa os três parâmetros. Os presets
   são pontos de ancoragem nessa mesma escala, e o slider anda livre entre eles
   — assim o ajuste fino nunca sai da família de curvas que já funciona. */
const DEPTH_PRESETS = [
  { name:"plano",       q:0.00, span:0.00, gamma:1.00, floor:1.000 },
  { name:"sutil",       q:0.28, span:0.40, gamma:1.80, floor:0.300 },
  { name:"médio",       q:0.50, span:0.66, gamma:1.70, floor:0.180 },
  { name:"forte",       q:0.75, span:0.88, gamma:1.50, floor:0.100 },
  { name:"muito forte", q:1.00, span:0.97, gamma:1.28, floor:0.035 },
];
const Depth = {
  near:null, far:null, tOf:()=>0, vis:()=>1,
  q: parseFloat(localStorage.getItem("mv_depthq") || "0.5"),
  span:0.66, gamma:1.7, floor:0.18,
  meter:false, meterUntil:0,
};

function depthPresetName(q){
  const hit = DEPTH_PRESETS.find(p => Math.abs(p.q - q) < 0.012);
  return hit ? hit.name : null;
}
function setDepthQ(q, opts){
  q = Math.max(0, Math.min(1, q));
  Depth.q = q;
  let lo = DEPTH_PRESETS[0], hi = DEPTH_PRESETS[DEPTH_PRESETS.length-1];
  for(let i=0;i<DEPTH_PRESETS.length-1;i++){
    if(q >= DEPTH_PRESETS[i].q && q <= DEPTH_PRESETS[i+1].q){ lo = DEPTH_PRESETS[i]; hi = DEPTH_PRESETS[i+1]; break; }
  }
  const k = hi.q === lo.q ? 0 : (q - lo.q)/(hi.q - lo.q);
  Depth.span  = lo.span  + (hi.span  - lo.span )*k;
  Depth.gamma = lo.gamma + (hi.gamma - lo.gamma)*k;
  Depth.floor = lo.floor + (hi.floor - lo.floor)*k;
  localStorage.setItem("mv_depthq", q.toFixed(4));

  const name = depthPresetName(q);
  const b = document.getElementById("h3depth");
  if(b){
    b.textContent = "profundidade · " + (name || Math.round(q*100) + "%");
    b.classList.toggle("on", q > 0.001);
  }
  const bar = document.getElementById("depthbar");
  if(bar){
    bar.querySelector(".dv").textContent = name ? name : Math.round(q*100) + "%";
    bar.querySelector(".dhandle").style.bottom = (q*100) + "%";
    bar.querySelector(".dfill").style.height = (q*100) + "%";
  }
  if(!(opts && opts.quiet) && typeof Scene !== "undefined" && Scene.t0)
    Depth.meterUntil = (performance.now() - Scene.t0)/1000 + 2.5;
}
function cycleDepthPreset(){
  const next = DEPTH_PRESETS.find(p => p.q > Depth.q + 0.012) || DEPTH_PRESETS[0];
  setDepthQ(next.q);
}

function frame3D(now){
  if(!Scene.on){ Scene.raf = null; return; }
  Scene.raf = requestAnimationFrame(frame3D);
  const t = (now - Scene.t0)/1000;

  applyKeys();
  const s = 0.18;
  Cam.dist  += (Cam.gDist  - Cam.dist ) * s;
  Cam.yaw   += (Cam.gYaw   - Cam.yaw  ) * s;
  Cam.pitch += (Cam.gPitch - Cam.pitch) * s;
  Cam.tgt = V3.lerp(Cam.tgt, Cam.gTgt, s);
  if(Scene.autoRot) Cam.gYaw += 0.0022;

  const ctx = Scene.ctx, W = Scene.w, H = Scene.h;
  const B = camBasis();

  /* fundo com vinheta */
  const g = ctx.createRadialGradient(W*0.5, H*0.42, 40, W*0.5, H*0.5, Math.max(W,H)*0.78);
  g.addColorStop(0, T().bgIn); g.addColorStop(1, T().bgOut);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  /* projeta tudo */
  ColorScale = colorScale();
  const ns = vNodes();
  Scene.proj = {}; Scene.rects = {};
  const drawList = [];
  ns.forEach(n => {
    const p = posOf(n);
    if(!p) return;
    const P = project(p, B);
    if(!P) return;
    Scene.proj[n.id] = P;
    const w = CARD_W * P.s, h = CARD_H * P.s * (Vis.shape==="barra" ? 0.62 : Vis.shape==="etiqueta" ? 0.46 : 1);
    Scene.rects[n.id] = { x:P.x, y:P.y, w, h, z:P.z };

    drawList.push({ n, P, w, h });
  });
  drawList.sort((a,b) => b.P.z - a.P.z);

  /* ---- perspectiva aérea ----
     A escala é ancorada nos extremos reais do recorte — o nó mais à frente e o
     mais ao fundo — exatamente como pedido, mas com os extremos suavizados no
     tempo: sem isso a cena inteira pisca de brilho a cada giro, porque quem é
     "o mais próximo" muda de quadro em quadro. */
  let zmin = Infinity, zmax = -Infinity;
  drawList.forEach(d => { if(d.P.z < zmin) zmin = d.P.z; if(d.P.z > zmax) zmax = d.P.z; });
  if(!isFinite(zmin)){ zmin = 1; zmax = 2; }
  Depth.near = Depth.near === null ? zmin : Depth.near + (zmin - Depth.near)*0.12;
  Depth.far  = Depth.far  === null ? zmax : Depth.far  + (zmax - Depth.far )*0.12;
  const dN = Depth.near, dF = Depth.far, dSpan = dF - dN;
  Depth.tOf = z => dSpan < 2 ? 0 : Math.max(0, Math.min(1, (z - dN)/dSpan));
  /* curva de potência: o terço da frente quase não perde nitidez e a queda se
     concentra no fundo. Névoa exponencial apagaria o miolo cedo demais num
     diagrama, onde o que importa quase sempre está no plano médio. */
  const fog = z => Math.max(Depth.floor, 1 - Depth.span * Math.pow(Depth.tOf(z), Depth.gamma));
  Depth.vis = fog;

  if(Scene.grid && !Scene.iso) drawGrid(ctx, B);
  if(!Scene.iso) drawAxis(ctx, B);
  if(Scene.iso) drawIsoPlane(ctx, B);

  /* arestas */
  const rel = Scene.related;
  const eList = vEdges().filter(e => Scene.rects[e.from] && Scene.rects[e.to]);
  eList.sort((a,b) => (Scene.rects[b.from].z + Scene.rects[b.to].z) - (Scene.rects[a.from].z + Scene.rects[a.to].z));
  const curves = {};
  eList.forEach(e => {
    const Ra = Scene.rects[e.from], Rb = Scene.rects[e.to];
    const ek = EDGE_KINDS[e.kind] || EDGE_KINDS.feeds;
    const C = edgeCurve(Ra, Rb, e); curves[e.id] = C;
    const kg = rel ? Math.max(kinGen(e.from), kinGen(e.to)) : null;
    const kdE = fog((Ra.z+Rb.z)/2), airE = 1 - kdE;
    const a = (rel ? kinAlpha(kg)*0.92 : 0.62) * (0.45 + 0.55*kdE);
    const selE = isSel("edge", e.id);
    ctx.beginPath();
    ctx.moveTo(C.p0.x, C.p0.y);
    ctx.bezierCurveTo(C.p1.x,C.p1.y, C.p2.x,C.p2.y, C.p3.x,C.p3.y);
    ctx.strokeStyle = selE ? hexA(col(ek.hex),1) : mixA(col(ek.hex), airE*0.72, a);
    ctx.lineWidth = (selE ? 3 : (Store.nodes[e.from]._trunk && Store.nodes[e.to]._trunk ? 2.2 : 1.3))
                  * (0.7 + 0.3*kdE) * Vis.edgeW;
    ctx.setLineDash(ek.dash ? ek.dash.split(" ").map(Number).map(v=>v*1.6) : []);
    ctx.stroke();
    ctx.setLineDash([]);
    if(a > 0.25) drawArrow(ctx, C, col(ek.hex), a, airE*0.72);
  });

  /* partículas de fluxo — só nas relações do nó selecionado */
  if(Scene.flow.length){
    Scene.flow.forEach(f => {
      const e = Store.edges[f.id], C = curves[f.id];
      if(!e || !C) return;
      const ek = EDGE_KINDS[e.kind] || EDGE_KINDS.feeds;
      const tt = ((t/Scene.flowCycle) + f.phase) % 1;
      const fade = Math.min(1, Math.sin(tt*Math.PI)*1.9);      // entra e sai suave
      for(let k=0;k<4;k++){
        const tk = tt - k*0.04; if(tk < 0) continue;
        const p = bez(C.p0,C.p1,C.p2,C.p3, tk);
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.3, 4 - k*0.7), 0, 6.2832);
        ctx.fillStyle = hexA(col(ek.hex), (1 - k*0.24) * fade);
        ctx.fill();
      }
      const head = bez(C.p0,C.p1,C.p2,C.p3, tt);
      const gg = ctx.createRadialGradient(head.x,head.y,0, head.x,head.y,13);
      gg.addColorStop(0, hexA(col(ek.hex), .4*fade)); gg.addColorStop(1, hexA(col(ek.hex),0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(head.x,head.y,13,0,6.2832); ctx.fill();
    });
  }

  /* selos de carga sobre os conectores */
  if(Scene.showPayload) drawPayloads(ctx, eList, curves, fog);

  /* cartões */
  drawList.forEach(d => drawCard(ctx, d.n, d.P, d.w, d.h, fog(d.P.z), t));

  /* âncoras da aresta selecionada */
  if(Store.sel && Store.sel.type === "edge"){
    const e = Store.edges[Store.sel.id];
    if(e && Scene.rects[e.from] && Scene.rects[e.to]){
      drawAnchors(ctx, Scene.rects[e.from], e.a1);
      drawAnchors(ctx, Scene.rects[e.to],   e.a2);
    }
  }

  if(Depth.meter || t < Depth.meterUntil) drawDepthMeter(ctx, t);
  drawCompass(ctx);
}

/* Régua da escala: mostra a curva aplicada entre o nó mais à frente e o mais
   ao fundo, com a marca de onde cai o nó em foco. Serve para calibrar de olho. */
function drawDepthMeter(ctx, t){
  const H = 190, W = 11, x = Math.max(40, Scene.w - 214), y = (Scene.h - H)/2 - 20;
  const pname = depthPresetName(Depth.q) || (Math.round(Depth.q*100) + "%");
  const BW = W + 118;

  ctx.save();
  ctx.fillStyle = T().mix ? "rgba(255,255,255,.9)" : "rgba(11,15,20,.82)";
  ctx.fillRect(x-9, y-26, BW, H+50);
  ctx.strokeStyle = "rgba(60,90,120,.5)"; ctx.lineWidth = 1;
  ctx.strokeRect(x-9, y-26, BW, H+50);

  ctx.font = "9px var(--mono)"; ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(143,163,184,.9)";
  ctx.fillText("PROFUNDIDADE · " + pname.toUpperCase(), x-3, y-14);

  /* a faixa é a própria curva: cada fatia usa a visibilidade daquele t */
  for(let i=0;i<H;i++){
    const tt = i/(H-1);
    const v = Math.max(Depth.floor, 1 - Depth.span * Math.pow(tt, Depth.gamma));
    ctx.fillStyle = mixHex(col("#4da3ff"), 1-v);
    ctx.fillRect(x, y+i, W, 1);
  }
  ctx.strokeStyle = "rgba(120,150,180,.45)"; ctx.strokeRect(x, y, W, H);

  ctx.fillStyle = "rgba(143,163,184,.85)";
  ctx.fillText("frente", x+W+7, y+6);
  ctx.fillText("fundo",  x+W+7, y+H-6);
  ctx.fillStyle = "rgba(93,113,137,.9)";
  ctx.fillText(Math.round(Depth.near) + "u", x+W+7, y+18);
  ctx.fillText(Math.round(Depth.far)  + "u", x+W+7, y+H-18);
  ctx.fillText("×" + Depth.floor.toFixed(2), x+W+7, y+H+12);

  /* marca do nó selecionado, senão do apontado */
  const id = (Store.sel && Store.sel.type === "node") ? Store.sel.id : Scene.hover;
  const P = id ? Scene.proj[id] : null;
  if(P){
    const tt = Depth.tOf(P.z), my = y + tt*H;
    ctx.beginPath(); ctx.moveTo(x-5, my); ctx.lineTo(x+W+4, my);
    ctx.strokeStyle = T().mix ? "#0b1018" : "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = T().mix ? "#0b1018" : "#ffffff";
    ctx.fillText(Math.round(Depth.vis(P.z)*100) + "%", x+W+7, my);
  }
  ctx.restore();
}

/* Selo curto no meio do conector: só o código, sem frase. Some quando a aresta
   é curta demais na tela ou quando outro selo já ocupa o lugar — é a regra que
   impede o grafo de virar um paredão de texto. */
function drawPayloads(ctx, eList, curves, fog){
  const rel = Scene.related;
  const selId = (Store.sel && Store.sel.type === "node") ? Store.sel.id : null;

  /* candidatos ordenados: primeiro os do nó em foco, depois os conectores mais
     longos na tela. Assim o selo cai onde há espaço, não onde calhou na lista. */
  const cand = [];
  for(const e of eList){
    const C = curves[e.id]; if(!C) continue;
    const pls = payloadOf(e); if(!pls.length) continue;
    const span = Math.hypot(C.p3.x-C.p0.x, C.p3.y-C.p0.y);
    if(span < 74) continue;
    const Ra = Scene.rects[e.from], Rb = Scene.rects[e.to];
    let a = fog((Ra.z+Rb.z)/2);
    if(rel) a *= kinAlpha(Math.max(kinGen(e.from), kinGen(e.to)));
    if(a < 0.3) continue;
    const prio = selId && (e.from === selId || e.to === selId) ? 1e6 : 0;
    cand.push({ e, C, pls, a, rank: prio + span });
  }
  cand.sort((x,y) => y.rank - x.rank);

  const placed = [];
  let drawn = 0;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  for(const c of cand){
    if(drawn >= 30) break;                                   // teto duro: o mapa vem antes do rótulo
    const { C, pls, a } = c;
    const m = bez(C.p0,C.p1,C.p2,C.p3, 0.5);
    const list = pls.slice(0,2);
    const txt = list.map(p => PAYLOADS[p].code).join(" ") + (pls.length > 2 ? " +" + (pls.length-2) : "");
    ctx.font = "600 9.5px var(--mono)";
    const w = ctx.measureText(txt).width + 10, h = 14;
    const box = { x:m.x - w/2, y:m.y - h/2, w, h };
    const pad = 13;                                          // respiro entre selos vizinhos
    if(placed.some(q => box.x < q.x+q.w+pad && box.x+box.w+pad > q.x
                     && box.y < q.y+q.h+pad && box.y+box.h+pad > q.y)) continue;
    placed.push(box); drawn++;

    const hex = col(PAYLOADS[list[0]].hex);
    ctx.beginPath(); roundRect(ctx, box.x, box.y, w, h, 0);
    ctx.fillStyle = `rgba(${T().badge},${0.9*a})`; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = hexA(hex, a*0.85); ctx.stroke();
    ctx.fillStyle = hexA(hex, Math.min(1, a*1.2));
    ctx.fillText(txt, m.x, m.y + 0.5);
  }
  ctx.textAlign = "left";
}

function drawArrow(ctx, C, hex, a, air){
  const p = bez(C.p0,C.p1,C.p2,C.p3,0.94), q = bez(C.p0,C.p1,C.p2,C.p3,1);
  const ang = Math.atan2(q.y-p.y, q.x-p.x), L = 8;
  ctx.beginPath();
  ctx.moveTo(q.x, q.y);
  ctx.lineTo(q.x - L*Math.cos(ang-0.45), q.y - L*Math.sin(ang-0.45));
  ctx.lineTo(q.x - L*Math.cos(ang+0.45), q.y - L*Math.sin(ang+0.45));
  ctx.closePath();
  ctx.fillStyle = air ? mixA(hex, air, a) : hexA(hex, a); ctx.fill();
}

function drawCard(ctx, n, P, w, h, fogA, t){
  const K = KINDS[n.kind]; if(!K) return;
  const L = LAYER_BY_ID[K.layer];
  const TH = T();
  const NC = col(nodeColor(n));
  const rel = Scene.related;
  const gen = rel ? kinGen(n.id) : null;
  const ka = kinAlpha(gen);
  const dim = rel && ka < 0.6;
  const sel = isSel("node", n.id);
  const nb  = Scene.neighbors ? Scene.neighbors.get(n.id) : null;
  const hov = Scene.hover === n.id;
  /* dois canais que não se misturam: profundidade tinge, foco opacifica */
  const kd = fogA, air = 1 - fogA;
  const A = ka;
  const ta = A * Math.pow(kd, 1.35);          // texto some antes da caixa

  const x = P.x - w/2, y = P.y - h/2, r = 0;

  ctx.save();

  /* sombra: cresce e escurece com a proximidade — depois do tamanho, é o cue
     mais forte de "isto está na minha frente" */
  const so = 1.2 + 5.5*kd;
  ctx.beginPath(); roundRect(ctx, x + so*0.55, y + so, w, h, 0);
  ctx.fillStyle = `rgba(0,0,0,${TH.shadow*Math.pow(kd,1.25)*A})`; ctx.fill();

  /* face — a etiqueta dispensa fundo */
  ctx.beginPath(); roundRect(ctx, x, y, w, h, r);
  if(Vis.shape === "etiqueta"){ ctx.globalAlpha = 1; }
  const g = ctx.createLinearGradient(x, y, x, y+h);
  const base = n._trunk ? TH.trunk : n._sat ? TH.sat : TH.card;
  g.addColorStop(0, mixHex(dim ? TH.dimTop : base, air*0.92));
  g.addColorStop(1, mixHex(dim ? TH.dimBot : (n._trunk ? TH.trunkBot : n._sat ? TH.satBot : TH.cardBot), air*0.92));
  ctx.fillStyle = g; ctx.globalAlpha = Math.max(0.12, A); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.beginPath(); roundRect(ctx, x, y, w, h, r);
  const mSel = Store.multi.has(n.id);
  ctx.lineWidth = (sel ? 2.6 : mSel ? 2.2 : n._trunk ? 1.9 : 1.1) * (0.68 + 0.32*kd);
  ctx.strokeStyle = sel ? (T().mix?"#0b1018":"#ffffff") : mSel ? (T().mix?"rgba(11,16,24,.9)":"rgba(255,255,255,.85)") : mixA(NC, air*0.82, A*(hov?1:0.85));
  if(Vis.shape !== "etiqueta" || sel || mSel || hov) ctx.stroke();

  if(sel){
    const pulse = 18 + Math.sin(t*3.1)*8;
    ctx.shadowColor = hexA(NC, 0.8); ctx.shadowBlur = pulse;
    ctx.stroke(); ctx.shadowBlur = 0;
  } else if(hov){
    ctx.shadowColor = hexA(NC, 0.7); ctx.shadowBlur = 12;
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  /* vizinho direto: anel externo fino na cor da relação — presente, mas
     claramente subordinado ao nó selecionado, que é branco e pulsa */
  if(nb && !sel){
    const ek = EDGE_KINDS[nb] || EDGE_KINDS.feeds;
    ctx.beginPath(); roundRect(ctx, x-5, y-5, w+10, h+10, r+4);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6,4]);
    ctx.strokeStyle = mixA(col(ek.hex), air*0.7, 0.62*A);
    ctx.shadowColor = hexA(col(ek.hex), 0.35*kd); ctx.shadowBlur = 7;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  }

  /* barra da camada e, se houver recorte, a faixa do fluxo */
  ctx.beginPath(); roundRect(ctx, x, y, Math.max(2.5, w*0.022), h, r);
  ctx.fillStyle = mixA(NC, air*0.75, A); ctx.fill();
  const fc = flowAccent(n);
  if(fc){
    ctx.beginPath(); roundRect(ctx, x, y, w, Math.max(2, h*0.055), r);
    ctx.fillStyle = mixA(col(fc), air*0.75, A); ctx.fill();
  }

  /* conteúdo, com nível de detalhe */
  ctx.textBaseline = "middle";
  const fg = dim ? `rgba(${TH.textFaint},${ta*1.6})` : `rgba(${TH.text},${Math.min(1,ta*1.15)})`;
  const S = Vis.show, meta = summarize(n);
  const lines = [];
  if(S.kind)  lines.push({ t:(S.icon ? K.icon + "  " : "") + K.label.toUpperCase(),
                           c: mixA(NC, air*0.8, ta*0.95), f: clamp(Math.max(7,Vis.fontMin*0.62), w*0.052, Math.max(11,Vis.fontMin*0.62)), w:"600" });
  if(S.label) lines.push({ t:n.label, c: fg, f: clamp(Math.max(10,Vis.fontMin), w*0.093, Math.max(19,Vis.fontMin)), w:"600" });
  if(S.meta && meta) lines.push({ t:meta, c: dim ? `rgba(${TH.textFaint},${ta})` : `rgba(${TH.textDim},${ta})`,
                           f: clamp(Math.max(7,Vis.fontMin*0.66), w*0.055, Math.max(12,Vis.fontMin*0.66)), w:"400", mono:true });

  if((w < 46 && !Vis.fontMin) || !lines.length){
    ctx.beginPath(); ctx.arc(P.x, P.y, Math.max(2.2, w*0.075), 0, 6.2832);
    ctx.fillStyle = mixA(NC, air*0.7, A); ctx.fill();
  } else if(w < 96){
    const main = lines.find(l => l.t === n.label) || lines[lines.length-1];
    ctx.fillStyle = main.c;
    ctx.font = `600 ${clamp(Math.max(8,Vis.fontMin), w*0.105, Math.max(15,Vis.fontMin))}px var(--sans)`;
    ctx.textAlign = "center";
    ctx.fillText(fit(ctx, main.t, w-16), P.x, P.y);
  } else {
    ctx.textAlign = "left";
    const px = x + w*0.075;
    const step = h/(lines.length+1);
    lines.forEach((l,i) => {
      ctx.fillStyle = l.c;
      ctx.font = `${l.w} ${l.f}px ${l.mono ? "var(--mono)" : "var(--sans)"}`;
      ctx.fillText(fit(ctx, l.t, w - w*0.15), px, y + step*(i+1));
    });
  }
  if(S.flows && (n.flows||[]).length && w > 60){
    (n.flows||[]).slice(0,6).forEach((fid,i) => {
      const f = flowById(fid); if(!f) return;
      ctx.fillStyle = mixA(col(f.color), air*0.6, A);
      ctx.fillRect(x + w - 7 - i*6, y + h - 6, 4, 4);
    });
  }
  if(n.pin3 && !dim){
    ctx.beginPath(); ctx.arc(x+w-7, y+7, 2.4, 0, 6.2832);
    ctx.fillStyle = `rgba(140,160,180,${A})`; ctx.fill();
  }
  ctx.restore();
}

function drawAnchors(ctx, R, cur){
  for(let i=0;i<8;i++){
    const p = anchorPoint(R, i);
    ctx.beginPath(); ctx.arc(p.x, p.y, cur === i ? 5 : 3.2, 0, 6.2832);
    ctx.fillStyle = cur === i ? "#ffffff" : "rgba(120,160,200,.75)";
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(10,15,22,.9)"; ctx.stroke();
  }
}

function drawGrid(ctx, B){
  const y = -(Scene.maxDepth + 0.6) * LEVEL_H;
  const R = Math.max(40, RING_MIN*1.9);
  ctx.lineWidth = 1;
  for(let k=1;k<=4;k++){
    const rr = R*k/4;
    ctx.beginPath();
    let started = false;
    for(let a=0; a<=64; a++){
      const th = a/64*Math.PI*2;
      const P = project({x:Math.cos(th)*rr, y, z:Math.sin(th)*rr}, B);
      if(!P){ started = false; continue; }
      if(!started){ ctx.moveTo(P.x,P.y); started = true; } else ctx.lineTo(P.x,P.y);
    }
    ctx.strokeStyle = `rgba(${T().grid},${0.05 + (4-k)*0.012})`;
    ctx.stroke();
  }
  for(let a=0;a<12;a++){
    const th = a/12*Math.PI*2;
    const p1 = project({x:0,y,z:0}, B), p2 = project({x:Math.cos(th)*R, y, z:Math.sin(th)*R}, B);
    if(!p1||!p2) continue;
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle = `rgba(${T().grid},.05)`; ctx.stroke();
  }
}

/* anel de piso do modo isolado: dá referência espacial sem a grade global */
function drawIsoPlane(ctx, B){
  const gens = Object.values(Scene.iso.gen);
  const maxG = Math.max(1, ...gens);
  ctx.lineWidth = 1;
  for(let d = -maxG; d <= maxG; d++){
    const y = d*ISO_Y, R = 34;
    ctx.beginPath(); let started = false;
    for(let a=0; a<=56; a++){
      const th = a/56*Math.PI*2;
      const P = project({x:Math.cos(th)*R, y, z:Math.sin(th)*R}, B);
      if(!P){ started = false; continue; }
      if(!started){ ctx.moveTo(P.x,P.y); started = true; } else ctx.lineTo(P.x,P.y);
    }
    ctx.strokeStyle = d === 0 ? `rgba(${T().grid},.2)` : `rgba(${T().grid},.07)`;
    ctx.stroke();
  }
}

function drawAxis(ctx, B){
  const a = project({x:0,y:4,z:0}, B), b = project({x:0,y:-(Scene.maxDepth+1)*LEVEL_H, z:0}, B);
  if(!a||!b) return;
  const g = ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  g.addColorStop(0,`rgba(${T().grid},.3)`); g.addColorStop(1,`rgba(${T().grid},.08)`);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.stroke();
}

function drawCompass(ctx){
  const cx = Scene.w - 52, cy = Scene.h - 52, R = 22;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832);
  ctx.fillStyle = T().mix ? "rgba(255,255,255,.85)" : "rgba(11,15,20,.72)"; ctx.fill();
  ctx.strokeStyle = "rgba(60,90,120,.6)"; ctx.lineWidth = 1; ctx.stroke();
  const a = -Cam.yaw;
  ctx.beginPath();
  ctx.moveTo(cx + Math.sin(a)*R*0.72, cy - Math.cos(a)*R*0.72);
  ctx.lineTo(cx + Math.sin(a+2.5)*R*0.42, cy - Math.cos(a+2.5)*R*0.42);
  ctx.lineTo(cx + Math.sin(a-2.5)*R*0.42, cy - Math.cos(a-2.5)*R*0.42);
  ctx.closePath(); ctx.fillStyle = col("#4da3ff"); ctx.fill();
  ctx.font = "9px var(--mono)"; ctx.fillStyle = "rgba(143,163,184,.9)";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(Math.round(-Cam.pitch*57.3) + "°", cx, cy + R + 11);
}

/* canto vivo em tudo — o parâmetro r fica por compatibilidade das chamadas */
function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath();
}
function clamp(a,v,b){ return Math.max(a, Math.min(b, v)); }
function fit(ctx, s, maxW){
  s = String(s||"");
  if(ctx.measureText(s).width <= maxW) return s;
  while(s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0,-1);
  return s + "…";
}

/* ==========================================================================
   Navegação — orbitar, deslocar, aproximar do ponto sob o cursor
   ========================================================================== */
function screenToGround(mx, my){
  const B = camBasis();
  const f = 1/Math.tan(Cam.fov/2);
  const ndx = (mx - Scene.w/2) / (Scene.h/2) / f;
  const ndy = -(my - Scene.h/2) / (Scene.h/2) / f;
  const dir = V3.norm(V3.add(B.fwd, V3.add(V3.mul(B.right, ndx), V3.mul(B.up, ndy))));
  const denom = dir.y;
  if(Math.abs(denom) < 1e-4) return null;
  const t = (Cam.tgt.y - B.eye.y)/denom;
  if(t < 0) return null;
  return V3.add(B.eye, V3.mul(dir, t));
}

function zoomAt(mx, my, factor){
  const under = pick(mx,my);
  const anchor = under && posOf(Store.nodes[under]) ? posOf(Store.nodes[under]) : screenToGround(mx,my);
  const nd = clamp(14, Cam.gDist * factor, 900);
  if(anchor){
    const k = 1 - nd/Cam.gDist;                 // aproxima o alvo do ponto mirado
    Cam.gTgt = V3.lerp(Cam.gTgt, anchor, clamp(0, k*0.9, 0.9));
  }
  Cam.gDist = nd;
}

function pick(mx,my){
  let best = null, bz = Infinity;
  for(const id in Scene.rects){
    const R = Scene.rects[id];
    if(mx >= R.x-R.w/2 && mx <= R.x+R.w/2 && my >= R.y-R.h/2 && my <= R.y+R.h/2 && R.z < bz){
      best = id; bz = R.z;
    }
  }
  return best;
}
function pickAnchor(mx,my){
  if(!Store.sel || Store.sel.type !== "edge") return null;
  const e = Store.edges[Store.sel.id]; if(!e) return null;
  for(const which of ["a1","a2"]){
    const R = Scene.rects[which === "a1" ? e.from : e.to]; if(!R) continue;
    for(let i=0;i<8;i++){
      const p = anchorPoint(R,i);
      if(Math.hypot(p.x-mx, p.y-my) < 9) return { which, i };
    }
  }
  return null;
}

function bind3D(){
  const cv = Scene.cv;
  const rel = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX-r.left, y: ev.clientY-r.top }; };

  cv.addEventListener("contextmenu", ev => ev.preventDefault());

  cv.addEventListener("pointerdown", ev => {
    cv.setPointerCapture(ev.pointerId);
    const m = rel(ev);
    const orbitBtn = ev.button === 2 || ev.button === 1 || ev.shiftKey;

    if(!orbitBtn){
      const anc = pickAnchor(m.x, m.y);
      if(anc){
        const e = Store.edges[Store.sel.id];
        e[anc.which] = (e[anc.which] === anc.i) ? null : anc.i;
        Store.dirty = true; renderRight(); return;
      }
      const id = pick(m.x, m.y);
      if(id){
        if(ev.ctrlKey || ev.metaKey){ toggleMulti(id); return; }
        if(UI.linking){
          if(!UI.linkFrom){ UI.linkFrom = id; setHint("origem: " + Store.nodes[id].label + " — clique no destino"); }
          else if(UI.linkFrom !== id){ openEdgeDialog(UI.linkFrom, id); endLinking(); }
          return;
        }
        select("node", id);
        Scene.drag = { id, m, moved:false };
        return;
      }
      if(!UI.linking) select(null);
      Scene.pan = { m, tgt:{...Cam.gTgt} };
      return;
    }
    Scene.orbit = { m, yaw:Cam.gYaw, pitch:Cam.gPitch };
  });

  cv.addEventListener("pointermove", ev => {
    const m = rel(ev);
    if(Scene.drag){
      const B = camBasis(), n = Store.nodes[Scene.drag.id];
      const cur = n && posOf(n);
      if(cur){
        const P = Scene.proj[n.id];
        if(P){
          const dx = (m.x - Scene.drag.m.x)/P.s, dy = -(m.y - Scene.drag.m.y)/P.s;
          const np = V3.add(cur, V3.add(V3.mul(B.right, dx), V3.mul(B.up, dy)));
          if(Scene.iso) Scene.iso.pos[n.id] = np;
          else { n.p3 = np; n.pin3 = true; Store.dirty = true; }
          Scene.drag.m = m; Scene.drag.moved = true;
        }
      }
      return;
    }
    if(Scene.orbit){
      Cam.gYaw   = Scene.orbit.yaw   - (m.x - Scene.orbit.m.x)*0.007;
      Cam.gPitch = clamp(-1.45, Scene.orbit.pitch + (m.y - Scene.orbit.m.y)*0.006, 1.45);
      return;
    }
    if(Scene.pan){
      const B = camBasis();
      const k = Cam.gDist * 0.0016;
      Cam.gTgt = V3.add(Scene.pan.tgt,
        V3.add(V3.mul(B.right, -(m.x - Scene.pan.m.x)*k), V3.mul(B.up, (m.y - Scene.pan.m.y)*k)));
      return;
    }
    const h = pick(m.x, m.y);
    if(h !== Scene.hover){ Scene.hover = h; cv.style.cursor = h ? "pointer" : "grab"; }
  });

  const end = () => { Scene.drag = null; Scene.orbit = null; Scene.pan = null; };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);

  cv.addEventListener("wheel", ev => {
    ev.preventDefault();
    const m = rel(ev);
    zoomAt(m.x, m.y, ev.deltaY < 0 ? 0.86 : 1/0.86);
  }, {passive:false});

  cv.addEventListener("dblclick", ev => {
    const m = rel(ev), id = pick(m.x, m.y);
    if(id) enterIsolate(id, Scene.iso ? Scene.iso.hops : 1);
    else if(Scene.iso) exitIsolate();
    else fit3D();
  });
}

function applyKeys(){
  const k = Scene.keys; if(!Scene.on) return;
  const B = camBasis(), sp = Cam.gDist*0.012;
  if(k.ArrowLeft)  Cam.gTgt = V3.add(Cam.gTgt, V3.mul(B.right, -sp));
  if(k.ArrowRight) Cam.gTgt = V3.add(Cam.gTgt, V3.mul(B.right,  sp));
  if(k.ArrowUp)    Cam.gTgt = V3.add(Cam.gTgt, V3.mul(B.up,     sp));
  if(k.ArrowDown)  Cam.gTgt = V3.add(Cam.gTgt, V3.mul(B.up,    -sp));
  if(k.a) Cam.gYaw   -= 0.022;
  if(k.d) Cam.gYaw   += 0.022;
  if(k.w) Cam.gPitch  = clamp(-1.45, Cam.gPitch + 0.018, 1.45);
  if(k.s) Cam.gPitch  = clamp(-1.45, Cam.gPitch - 0.018, 1.45);
  if(k["+"] || k["="]) Cam.gDist = clamp(14, Cam.gDist*0.97, 900);
  if(k["-"] || k["_"]) Cam.gDist = clamp(14, Cam.gDist*1.03, 900);
}

function fit3D(){
  const ns = vNodes().filter(n => posOf(n)); if(!ns.length) return;
  const min = {x:1e9,y:1e9,z:1e9}, max = {x:-1e9,y:-1e9,z:-1e9};
  ns.forEach(n => { const p = posOf(n);
    ["x","y","z"].forEach(a => { min[a]=Math.min(min[a],p[a]); max[a]=Math.max(max[a],p[a]); }); });
  /* margem: a caixa ocupa espaço além do ponto que a ancora */
  min.x -= CARD_W*0.6; max.x += CARD_W*0.6;
  min.z -= CARD_W*0.6; max.z += CARD_W*0.6;
  min.y -= CARD_H*0.9; max.y += CARD_H*0.9;
  const c = { x:(min.x+max.x)/2, y:(min.y+max.y)/2, z:(min.z+max.z)/2 };
  const rad = Math.max(CARD_W, V3.len(V3.sub(max,min))/2);
  Cam.gTgt = c;
  Cam.gPitch = clamp(-1.45, Cam.gPitch, -0.18);

  /* A esfera envolvente subestima o enquadramento: um cartão do lado de cá do
     anel projeta bem maior que o raio sugere. Então refina de verdade —
     projeta tudo com a câmera de destino e afasta até caber. */
  let d = clamp(30, rad/Math.sin(Cam.fov/2), 900);
  const save = { tgt:Cam.tgt, dist:Cam.dist, yaw:Cam.yaw, pitch:Cam.pitch };
  Cam.tgt = c; Cam.yaw = Cam.gYaw; Cam.pitch = Cam.gPitch;
  for(let it=0; it<10; it++){
    Cam.dist = d;
    const B = camBasis();
    let need = 1;
    ns.forEach(n => {
      const P = project(posOf(n), B);
      if(!P){ need = Math.max(need, 1.4); return; }
      const hw = CARD_W*P.s/2, hh = CARD_H*P.s/2;
      need = Math.max(need,
        (Math.abs(P.x - Scene.w/2) + hw) / Math.max(1, Scene.w/2 * 0.93),
        (Math.abs(P.y - Scene.h/2) + hh) / Math.max(1, Scene.h/2 * 0.90));
    });
    if(need <= 1.002) break;
    d *= Math.min(need, 2.2);
  }
  Cam.tgt = save.tgt; Cam.dist = save.dist; Cam.yaw = save.yaw; Cam.pitch = save.pitch;
  Cam.gDist = clamp(30, d, 900);
}
function focusNode(id){
  const n = Store.nodes[id]; const p = n && posOf(n); if(!p) return;
  select("node", id);
  Cam.gTgt = {...p};
  Cam.gDist = clamp(26, CARD_W*4.2, 900);
}
function resetCam(){ Cam.gYaw = 0.7; Cam.gPitch = -0.38; exitIsolate(); fit3D(); }
function viewPreset(p){
  if(p === "top"){ Cam.gPitch = -1.35; Cam.gYaw = 0; }
  if(p === "front"){ Cam.gPitch = -0.05; Cam.gYaw = 0; }
  if(p === "iso"){ Cam.gPitch = -0.42; Cam.gYaw = 0.7; }
  if(p === "side"){ Cam.gPitch = -0.05; Cam.gYaw = Math.PI/2; }
}

/* ==========================================================================
   Modo
   ========================================================================== */
function set3D(on){
  Scene.on = on;
  document.getElementById("svg").style.display = on ? "none" : "block";
  document.getElementById("c3d").style.display = on ? "block" : "none";
  document.getElementById("hud3d").style.display = on ? "flex" : "none";
  document.getElementById("zoombar").style.display = on ? "none" : "flex";
  document.getElementById("btn2d").classList.toggle("on", !on);
  document.getElementById("btn3d").classList.toggle("on", on);
  document.getElementById("btnAuto").textContent = on ? "Reorganizar" : "Auto-layout";
  Scene.keys = {};
  setHint(null);
  if(on){
    if(!Scene.cv){
      Scene.cv = document.getElementById("c3d");
      Scene.ctx = Scene.cv.getContext("2d");
      Scene.t0 = performance.now();
      bind3D();
    }
    resize3D();
    layout3D(!nodeList().some(n => n.p3));
    buildFocus();
    if(Scene.needFit || !Scene.everFit){ fit3D(); Scene.needFit = false; Scene.everFit = true; }
    if(!Scene.raf) Scene.raf = requestAnimationFrame(frame3D);
    bindDepthBar();
    document.getElementById("depthbar").style.display = "flex";
    setDepthQ(Depth.q, {quiet:true});
    syncPayloadUi();
  } else {
    const lg = document.getElementById("legend3d"); if(lg) lg.style.display = "none";
    const db = document.getElementById("depthbar"); if(db) db.style.display = "none";
    if(Scene.raf){ cancelAnimationFrame(Scene.raf); Scene.raf = null; }
    computeLayout(false); render();
  }
  refreshPanels();
}

/* ==========================================================================
   Boot
   ========================================================================== */
function persist(){ try{ localStorage.setItem("mv_graph", toJson()); }catch(_){} }

function boot(){
  applyCardSize();
  document.body.classList.toggle("light", Theme.name === "claro");
  buildDefs();
  setHint(null);

  document.getElementById("presexit").onclick = () => togglePresentation();
  document.getElementById("viewPill").onclick = () => { setView([]); refreshPanels(); };
  document.getElementById("btn2d").onclick = () => set3D(false);
  document.getElementById("btn3d").onclick = () => set3D(true);
  document.querySelectorAll("#hud3d [data-v]").forEach(b =>
    b.onclick = () => viewPreset(b.getAttribute("data-v")));
  document.getElementById("h3fit").onclick   = () => { exitIsolate(); fit3D(); };
  document.getElementById("h3reset").onclick = resetCam;
  document.getElementById("h3iso").onclick   = () => {
    if(Scene.iso) exitIsolate();
    else if(Store.sel && Store.sel.type === "node") enterIsolate(Store.sel.id, 1);
    else toast("selecione um nó para isolar"); };
  document.getElementById("h3pl").onclick    = () => {
    Scene.showPayload = !Scene.showPayload; syncPayloadUi(); };
  document.getElementById("h3depth").onclick = () => cycleDepthPreset();
  document.getElementById("h3grid").onclick  = ev => {
    Scene.grid = !Scene.grid; ev.currentTarget.classList.toggle("on", Scene.grid); };
  document.getElementById("h3spin").onclick  = ev => {
    Scene.autoRot = !Scene.autoRot; ev.currentTarget.classList.toggle("on", Scene.autoRot); };
  document.getElementById("h3unpin").onclick = () => {
    nodeList().forEach(n => n.pin3 = false); layout3D(true); fit3D(); Store.dirty = true; };

  document.getElementById("btnAuto").onclick     = () => redraw(true);
  document.getElementById("btnLink").onclick     = toggleLinking;
  document.getElementById("btnDelete").onclick   = deleteSelection;
  document.getElementById("btnValidate").onclick = () => {
    rightTab = "issues";
    document.querySelectorAll("[data-rt]").forEach(x => x.classList.toggle("on", x.getAttribute("data-rt")==="issues"));
    refreshPanels();
  };
  document.getElementById("btnMermaid").onclick = () => showMermaid(false);
  document.getElementById("btnAscii").onclick   = () => showExport("ASCII / Markdown", toAscii(), slug()+".md","text/markdown");
  document.getElementById("btnJson").onclick    = () => showExport("JSON", toJson(), slug()+".json","application/json");
  document.getElementById("btnZoomIn").onclick  = () => zoomBy(1.2);
  document.getElementById("btnZoomOut").onclick = () => zoomBy(1/1.2);
  document.getElementById("btnZoomFit").onclick = zoomFit;
  document.getElementById("btnSettings").onclick = () => openSettings();
  document.getElementById("btnSeed").onclick = () => {
    if(nodeList().length && !confirm("Substituir o grafo atual pelo exemplo?")) return;
    seedShortVol(); persist();
  };
  document.getElementById("btnNew").onclick = () => {
    if(nodeList().length && !confirm("Descartar o grafo atual?")) return;
    Store.nodes={}; Store.edges={}; Store.sel=null; Store.name="arquitetura sem título";
    redraw(); persist();
  };
  document.getElementById("btnSave").onclick = () => { persist(); download(slug()+".json", toJson(), "application/json"); };
  document.getElementById("btnOpen").onclick = () => {
    const i = document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange = () => { const f = i.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = () => { try{ loadJson(r.result); persist(); toast("carregado"); }
        catch(err){ alert("JSON inválido: "+err.message); } }; r.readAsText(f); };
    i.click();
  };
  document.getElementById("graphName").addEventListener("dblclick", () => {
    const v = prompt("Nome da arquitetura:", Store.name);
    if(v){ Store.name = v; render(); persist(); }
  });

  const saved = localStorage.getItem("mv_graph");
  if(saved){ try{ loadJson(saved); }catch(_){ seedShortVol(); } }
  else seedShortVol();

  setInterval(() => { if(Store.dirty){ persist(); Store.dirty = false; } }, 2000);
  window.addEventListener("resize", () => { if(Scene.on) resize3D(); else render(); });
}
boot();

</script>
